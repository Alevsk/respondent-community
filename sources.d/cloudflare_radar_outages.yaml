transport:
  type: http_poll
  url: "https://api.cloudflare.com/client/v4/radar/annotations/outages?limit=100&dateRange=30d"
  method: GET
  headers:
    Accept: "application/json"
  auth:
    type: bearer
    env_var: "CLOUDFLARE_RADAR_TOKEN"
  timeout: "30s"
  interval: "900s"  # 15 minutes
  max_response_bytes: 5242880  # 5MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "5s"
    max_delay: "60s"

# --- Response Parsing ---
parser:
  format: json
  records_path: "result.annotations"
  max_records: 500

# --- Record Filtering (CEL) ---
# Only process annotations that have at least one location we can resolve
filter: >
  has(record.locations) && size(record.locations) > 0
  && has_lookup("countries", record.locations[0])

# --- Entity Mapping (CEL) ---
entity:
  external_id: >
    record.id
  name: >
    has(record.description) && record.description != ""
      ? record.description
      : (has(record.outage) && has(record.outage.outageType) ? record.outage.outageType : "OUTAGE") + " — " + record.locations[0]
  metadata:
    outage_type: >
      has(record.outage) && has(record.outage.outageType) ? record.outage.outageType : ""
    scope: >
      has(record.scope) ? record.scope : ""
    description: >
      has(record.description) ? record.description : ""
    start_date: >
      has(record.startDate) ? record.startDate : ""
    end_date: >
      has(record.endDate) ? record.endDate : ""
    linked_url: >
      has(record.linkedUrl) ? record.linkedUrl : ""

# --- Observation Mapping (CEL) ---
observation:
  latitude: >
    lookup("countries", record.locations[0], "lat")
  longitude: >
    lookup("countries", record.locations[0], "lon")
  altitude: "0.0"
  timestamp: >
    now()
  event_time: >
    parse_iso8601(record.startDate)
  event_end: >
    has(record.endDate) && record.endDate != "null" ? parse_iso8601(record.endDate) : now()
  velocity: {}
  metadata:
    outage_type: >
      has(record.outage) && has(record.outage.outageType) ? record.outage.outageType : ""
    scope: >
      has(record.scope) ? record.scope : ""
    description: >
      has(record.description) ? record.description : ""
    start_date: >
      has(record.startDate) ? record.startDate : ""
    end_date: >
      has(record.endDate) ? record.endDate : ""
    country_code: >
      record.locations[0]
    country_name: >
      lookup("countries", record.locations[0], "name")
  content_hash: >
    record.id

# --- Recording ---
recording:
  mode: upsert

# --- Cache ---
cache:
  ttl: "1800s"  # 30 minutes

# --- Display ---
display:
  icon:
    shape: warning
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff6600"
    width: 1.5
    opacity: 0.7
  style:
    color: "#ff6600"
    point_size: 6
  field_renderers:
    - keys: [outage_type]
      label: "OUTAGE TYPE"
      format:
        type: string
        transform: upper
      priority: 0
    - keys: [scope]
      label: "SCOPE"
      format:
        type: string
        transform: upper
      priority: 1
    - keys: [description]
      label: "DESCRIPTION"
      format:
        type: string
      priority: 2
    - keys: [start_date]
      label: "START"
      format:
        type: string
      priority: 3

# --- History ---
history:
  max_lookback: "720h"     # 30 days
  max_range_span: "168h"   # 7 days per query window
