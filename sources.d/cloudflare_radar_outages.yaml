# sources.d/cloudflare_radar_outages.yaml
# Cloudflare Radar — Internet Outage Annotations
# Source: https://api.cloudflare.com/client/v4/radar/annotations/outages
# Auth: Bearer token via RESPONDENT_CLOUDFLARE_RADAR_TOKEN env var
# Format: JSON object with result.annotations array
#
# Tracks internet outages and disruptions worldwide as detected by Cloudflare's
# global network. Locations are ISO 3166-1 alpha-2 country codes resolved to
# centroids via lookup table.
schema_version: 1

name: cloudflare_radar_outages
labels:
  category: "infrastructure"
  priority: "high"

# --- Identity ---
source_type: cloudflare_radar_outages
layer_type: internet_outages
display_name: "Cloudflare Radar Internet Outages"

# --- Operational Controls ---
enabled: true  # Requires Cloudflare account API token

# Country centroid lookup table — maps ISO 3166-1 alpha-2 codes to lat/lon.
# ~60 countries by internet presence / geopolitical relevance.
lookup_tables:
  - name: "countries"
    key_field: "code"
    entries:
      # ── North America ──
      - { code: "US", lat: 39.8283, lon: -98.5795, name: "United States" }
