# sources.d/reliefweb_disasters.yaml
# ReliefWeb Disasters — UN OCHA (Office for the Coordination of Humanitarian Affairs)
# Source: https://api.reliefweb.int/v1/disasters
# Auth: Requires approved appname query parameter (set via RESPONDENT_RELIEFWEB_APPNAME env var)
# Format: JSON with nested data[].fields structure
#
# NOTE: The ReliefWeb disasters API does NOT return geographic coordinates.
# primary_country only provides id, iso3, name, and shortname.
# We use a lookup table mapping ISO3 country codes to country centroids.
#
# IMPORTANT: As of November 2025, ReliefWeb requires a pre-approved appname.
# Register at: https://apidoc.reliefweb.int/parameters#appname
# Set the env var RESPONDENT_RELIEFWEB_APPNAME to your approved appname.
schema_version: 1

name: reliefweb_disasters
labels:
  category: humanitarian
  priority: high

# --- Identity ---
source_type: reliefweb_disasters
layer_type: humanitarian
display_name: "ReliefWeb Disasters (UN OCHA)"

# --- Operational Controls ---
# Disabled: ReliefWeb now requires an approved appname (403 without one).
# To enable: request an appname at https://apidoc.reliefweb.int/parameters#appname
enabled: false

# ISO3 country code -> centroid coordinates lookup table.
