# --- Ingestion ---
transport:
  type: http_poll
  # ReliefWeb API v1 disasters endpoint.
  # The appname is loaded from RESPONDENT_RELIEFWEB_APPNAME env var.
  # Register for an approved appname at: https://apidoc.reliefweb.int/parameters#appname
  url: "https://api.reliefweb.int/v1/disasters?appname=${RELIEFWEB_APPNAME}&preset=latest&limit=50&fields%5Binclude%5D%5B%5D=country&fields%5Binclude%5D%5B%5D=date&fields%5Binclude%5D%5B%5D=primary_country&fields%5Binclude%5D%5B%5D=glide&fields%5Binclude%5D%5B%5D=name&fields%5Binclude%5D%5B%5D=status&fields%5Binclude%5D%5B%5D=type"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "15s"
  interval: "3600s"  # 1 hour
  max_response_bytes: 10485760  # 10MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "2s"
    max_delay: "30s"

# --- Response Parsing ---
# ReliefWeb returns: { "data": [ { "id": 123, "fields": { ... } }, ... ] }
# records_path extracts the data array; each record is { id, fields, score, href }.
parser:
  format: json
  records_path: "data"
  max_records: 1000

# --- Record Filtering (CEL) ---
# Only process records that have primary_country with iso3 and that exist in our lookup table.
filter: >
  has(record.fields) && has(record.fields.primary_country)
  && has(record.fields.primary_country.iso3)
  && has_lookup("country_centroids", record.fields.primary_country.iso3)

# --- Entity Mapping (CEL) ---
entity:
  external_id: >
    string(record.id)
  name: >
    has(record.fields.name) ? record.fields.name : "ReliefWeb Disaster"
  metadata:
    disaster_type: >
      has(record.fields.type) && size(record.fields.type) > 0 && has(record.fields.type[0].name)
        ? record.fields.type[0].name
        : ""
    status: >
      has(record.fields.status) ? record.fields.status : ""
    country: >
      has(record.fields.primary_country) && has(record.fields.primary_country.name)
        ? record.fields.primary_country.name
        : ""
    iso3: >
      record.fields.primary_country.iso3
    glide: >
      has(record.fields.glide) && size(record.fields.glide) > 0
        ? record.fields.glide[0].code
        : ""

# --- Observation Mapping (CEL) ---
observation:
  # Coordinates come from the country centroids lookup table keyed by ISO3.
  latitude: >
    lookup("country_centroids", record.fields.primary_country.iso3, "lat")
  longitude: >
    lookup("country_centroids", record.fields.primary_country.iso3, "lon")
  altitude: "0.0"
  # date.created is ISO 8601 format (e.g., "2026-03-01T00:00:00+00:00")
  timestamp: >
    has(record.fields.date) && has(record.fields.date.created)
      ? parse_iso8601(record.fields.date.created)
      : now()
  velocity: {}
  metadata:
    status: >
      has(record.fields.status) ? record.fields.status : ""
    disaster_type: >
      has(record.fields.type) && size(record.fields.type) > 0 && has(record.fields.type[0].name)
        ? record.fields.type[0].name
        : ""
  content_hash: ""

# --- Recording ---
recording:
  mode: upsert

# --- Cache ---
cache:
  ttl: "7200s"  # 2 hours (survive a couple missed polls)

# --- Display ---
display:
  icon:
    shape: warning
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff8c00"
    width: 1.5
    opacity: 0.8
  style:
    color: "#ff8c00"
    point_size: 6
  field_renderers:
    - keys: [disaster_type]
      label: "DISASTER TYPE"
      format:
        type: string
        transform: upper
      priority: 0
    - keys: [status]
      label: "STATUS"
      format:
        type: string
        transform: upper
      priority: 1
    - keys: [country]
      label: "COUNTRY"
      format:
        type: string
      priority: 2
    - keys: [glide]
      label: "GLIDE"
      format:
        type: string
      priority: 3

# --- History ---
history:
  max_lookback: "4320h"    # 180 days
  max_range_span: "168h"   # 7 days per query window
