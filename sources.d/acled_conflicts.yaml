# sources.d/acled_conflicts.yaml
# ACLED — Armed Conflict Location & Event Data
# Source: https://acleddata.com/
# Data: ACLED Explorer pre-built static JSON (public, no auth required)
#       https://apps.acleddata.com/newexplorer/standard/
#
# Polls the monthly global overview and ingests the `countryTimeline` array,
# which provides **daily per-country** conflict metrics over the last ~29 days
# (~6200 records per fetch). Each record carries event counts, fatalities,
# population exposure, and exposure percentage for a single country on a
# single day, with real date-based timestamps.
#
# Country centroids and display names are resolved via the inline
# country_coords lookup table (252 entries).
#
# NOTE: For event-level precision with individual geolocated incidents,
# the ACLED REST API at https://acleddata.com/api/acled/read requires an
# approved myACLED account with data-tier access and uses OAuth2 password-
# grant auth. The OAuth2 token provider in the ingest engine supports
# this — switch back when API access is granted.
schema_version: 1

name: acled_conflicts
labels:
  category: conflict
  priority: high
source_type: acled_conflicts
layer_type: conflict_events
display_name: "ACLED Armed Conflict Events"

enabled: true

# Country ID -> centroid coordinates + display name (252 entries).
# Names sourced from ACLED Explorer country list; coords from countryBounds.json.
lookup_tables:
  - name: "country_coords"
    key_field: "id"
