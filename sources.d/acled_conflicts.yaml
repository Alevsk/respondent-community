transport:
  type: http_poll
  url: "https://apps.acleddata.com/newexplorer/standard/data/acled/month_all_overview.json"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "30s"
  interval: "86400s" # 24 hours — Explorer returns monthly/daily snapshots
  max_response_bytes: 10485760  # 10MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "5s"
    max_delay: "60s"

parser:
  format: json
  records_path: "countryTimeline"
  max_records: 10000

# Filter: only days with actual events and a known centroid
filter: >
  has(record.events) && record.events > 0
  && has(record.id)
  && has_lookup("country_coords", string(int(record.id)))

entity:
  external_id: >
    string(int(record.id))
  name: >
    lookup("country_coords", string(int(record.id)), "name")
  metadata:
    country_id: >
      string(int(record.id))

observation:
  latitude: >
    lookup("country_coords", string(int(record.id)), "lat")
  longitude: >
    lookup("country_coords", string(int(record.id)), "lng")
  altitude: "0.0"
  timestamp: >
    parse_datetime(record.date, "2006-01-02")
  event_time: >
    parse_datetime(record.date, "2006-01-02")
  velocity: {}
  metadata:
    date: >
      record.date
    events: >
      string(int(record.events))
    fatalities: >
      string(int(record.fatalities))
    exposure: >
      string(int(record.exposure))
    exposure_pct: >
      string(record.exposure_pct)
  content_hash: >
    string(int(record.id)) + "_" + record.date + "_" + string(int(record.events)) + "_" + string(int(record.fatalities)) + "_" + string(int(record.exposure))

recording:
  mode: upsert

cache:
  ttl: "7200s"

display:
  icon:
    shape: explosion
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff4444"
    width: 1.5
    opacity: 0.7
  style:
    color: "#ff4444"
    point_size: 6
  field_renderers:
    - keys: [date]
      label: "DATE"
      format:
        type: string
      priority: 0
    - keys: [events]
      label: "EVENTS"
      format:
        type: string
      priority: 1
    - keys: [fatalities]
      label: "FATALITIES"
      format:
        type: string
      priority: 2
    - keys: [exposure]
      label: "POP EXPOSED"
      format:
        type: string
      priority: 3
    - keys: [exposure_pct]
      label: "EXPOSURE %"
      format:
        type: string
        suffix: "%"
      priority: 4

history:
  max_lookback: "2160h"      # 90 days
  max_range_span: "720h"     # 30 days per query window
