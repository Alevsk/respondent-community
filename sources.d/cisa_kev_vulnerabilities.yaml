# sources.d/cisa_kev_vulnerabilities.yaml
# CISA Known Exploited Vulnerabilities (KEV) Catalog
# Source: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# Auth: None required (US Government public data)
# Format: JSON object { title, catalogVersion, dateReleased, count, vulnerabilities: [...] }
#
# A cyber-threat indicator surfacing the size of CISA's catalog of vulnerabilities
# with confirmed active exploitation, plus how many were added in the last 7/30
# days (the actionable "what's being exploited right now" signal). Complements the
# cyber-security news layers with a structured, authoritative exploitation feed.
#
# Rendered as a global_indicator HUD panel (no globe position).
schema_version: 2

name: cisa_kev_vulnerabilities
labels:
  category: cyber
  priority: high

source_type: cisa_kev_vulnerabilities
layer_type: cyber_vulnerabilities
display_name: "Known Exploited Vulns"
entity_type: global_indicator

enabled: true

transport:
  type: http_poll
  url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  method: GET
  headers:
    Accept: "application/json"
    User-Agent: "respondent-geoint/1.0"
  timeout: "30s"
  interval: "3600s"  # 1 hour -- catalog updates a few times per week
  max_response_bytes: 10485760  # 10MB (~3MB actual)
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "5s"
    max_delay: "60s"

# Top-level JSON object -> single record (records_path omitted). CEL reads
# record.count and the record.vulnerabilities array directly.
parser:
  format: json
  max_records: 1

entity:
  external_id: '"cisa_kev"'
  name: '"CISA Known Exploited Vulnerabilities"'
  metadata:
    source: '"CISA KEV Catalog"'

observation:
  timestamp: 'now()'
  metadata:
    # Total catalog size.
    kev_total: 'string(record.count)'
    # Count added in the trailing 7 / 30 days. dateAdded is "YYYY-MM-DD", so a
    # lexicographic >= against the formatted cutoff date is correct ordering.
    kev_added_7d: >
      string(record.vulnerabilities.filter(v,
        has(v.dateAdded) && v.dateAdded >= string(now() - duration("168h")).substring(0, 10)).size())
    kev_added_30d: >
      string(record.vulnerabilities.filter(v,
        has(v.dateAdded) && v.dateAdded >= string(now() - duration("720h")).substring(0, 10)).size())
  content_hash: >
    string(record.catalogVersion) + "_" + string(record.count)

recording:
  mode: append

cache:
  ttl: "7200s"  # 2 hours -- survive a missed hourly poll

indicator:
  values:
    - key: kev_added_7d
      label: "Added 7d"
      source_field: kev_added_7d
      unit: ""
      format: number
      precision: 0
      max_level: 5
      level_thresholds: [1, 3, 5, 10, 20]
    - key: kev_added_30d
      label: "Added 30d"
      source_field: kev_added_30d
      unit: ""
      format: number
      precision: 0
      max_level: 5
      level_thresholds: [5, 15, 30, 50, 80]
    - key: kev_total
      label: "Catalog Size"
      source_field: kev_total
      unit: ""
      format: number
      precision: 0
      max_level: 1
      # Informational total -- never drives severity (threshold far above any value).
      level_thresholds: [1000000]
  summary_expr: >
    level >= 4 ? "Exploitation surge" : level >= 2 ? "Elevated" : "Nominal"

display:
  icon:
    shape: dot
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff5577"
    width: 1.0
    opacity: 0.5
  style:
    color: "#ff5577"
    point_size: 1
