schema_version: 2
name: tle_api_satellites
labels:
  category: space
  priority: medium
source_type: tle_api_satellites
layer_type: satellites
display_name: "TLE API Satellites"


transport:
  type: http_poll
  url: "https://tle.ivanstanojevic.me/api/tle/"
  method: GET
  headers:
    Accept: "application/json"
    User-Agent: "Respondent/1.0 (satellite-tracker; +https://github.com/Alevsk/respondent)"
  timeout: "60s"
  interval: "300s"
  max_response_bytes: 10485760
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: "2s"
    max_delay: "30s"
  pagination:
    type: page_number
    page_param: "page"
    size_param: "page_size"
    size: 100
    max_pages: 10
    stop_when: "size(records) == 0"

parser:
  format: json
  records_path: "member"
  max_records: 5000

filter: >
  has(record.line1) && has(record.line2) && sgp4_lat(record.line1, record.line2) != 0.0

entity:
  external_id: >
    string(record.satelliteId)
  name: >
    has(record.name) ? record.name : string(record.satelliteId)
  metadata:
    norad_id: >
      string(record.satelliteId)
    tle_line1: >
      record.line1
    tle_line2: >
      record.line2

observation:
  latitude: >
    sgp4_lat(record.line1, record.line2)
  longitude: >
    sgp4_lon(record.line1, record.line2)
  altitude: >
    sgp4_alt_m(record.line1, record.line2)
  timestamp: >
    now()
  velocity:
    speed: >
      string(sgp4_vel_mps(record.line1, record.line2))
  metadata:
    timestamp: >
      string(now())
  content_hash: ""

recording:
  mode: append

cache:
  ttl: "600s"

display:
  icon:
    shape: diamond
    rotatable: false
    interpolation: true
    scale: 1.0
  trail:
    color: "#00bfff"
    width: 1.0
    opacity: 0.5
  style:
    color: "#00bfff"
    point_size: 6
  field_renderers:
    - keys: [norad_id]
      label: "NORAD ID"
      format:
        type: string
      priority: 0
