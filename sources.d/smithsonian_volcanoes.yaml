# sources.d/smithsonian_volcanoes.yaml
# Significant volcanic eruptions from the NOAA NCEI Significant Volcanic
# Eruptions Database. Data originates from the Smithsonian Institution's
# Global Volcanism Program and is served through the NOAA Hazard Service API.
#
# API docs: https://www.ngdc.noaa.gov/hazel/hazard-service/api/v1/volcanoes
# The minYear parameter limits results to eruptions from 2000 onward.
# maxRows=500 is well above the ~150 events in that range.
schema_version: 1

name: smithsonian_volcanoes
labels:
  category: geological
  priority: low

# --- Identity ---
source_type: smithsonian_volcanoes
layer_type: volcanoes
display_name: "Smithsonian Volcanoes"

# --- Ingestion ---
transport:
  type: http_poll
  url: "https://www.ngdc.noaa.gov/hazel/hazard-service/api/v1/volcanoes?minYear=2000&maxRows=500"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "15s"
  interval: "3600s"
  max_response_bytes: 10485760  # 10MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "2s"
    max_delay: "30s"

# --- Response Parsing ---
parser:
  format: json
  records_path: "items"
  max_records: 10000

# --- Record Filtering (CEL) ---
# Require valid coordinates and eruption flag.
filter: >
  has(record.latitude) && has(record.longitude) && record.eruption == true

# --- Entity Mapping (CEL) ---
# Use volcanoLocationNewNum as a stable ID per volcano location. Multiple
# eruption events at the same volcano will upsert to a single entity, keeping
# the most recent eruption data visible.
entity:
  external_id: >
    string(record.volcanoLocationNewNum)
  name: >
    has(record.name) ? record.name : ("Volcano " + string(record.id))
  metadata:
    elevation: >
      has(record.elevation) ? string(record.elevation) : ""
    morphology: >
      has(record.morphology) ? record.morphology : ""
    status: >
      has(record.status) ? record.status : ""
    country: >
      has(record.country) ? record.country : ""
    location: >
      has(record.location) ? record.location : ""
    vei: >
      has(record.vei) ? string(record.vei) : ""
    last_eruption_year: >
      has(record.year) ? string(record.year) : ""

# --- Observation Mapping (CEL) ---
observation:
  latitude: >
    double(record.latitude)
  longitude: >
    double(record.longitude)
  altitude: >
    has(record.elevation) ? double(record.elevation) : 0.0
  # No precise timestamp in the API; use ingestion time.
  timestamp: >
    now()
  velocity: {}
  metadata:
    vei: >
      has(record.vei) ? string(record.vei) : ""
    morphology: >
      has(record.morphology) ? record.morphology : ""
  content_hash: >
    string(record.volcanoLocationNewNum) + "_" + (has(record.vei) ? string(record.vei) : "") + "_" + (has(record.status) ? record.status : "") + "_" + (has(record.elevation) ? string(record.elevation) : "")

# --- Recording ---
recording:
  mode: dedupe

# --- Cache ---
cache:
  ttl: "7200s"

# --- Display (consumed by frontend) ---
display:
  icon:
    shape: volcano
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#b71c1c"
    width: 1.5
    opacity: 0.7
  style:
    color: "#b71c1c"
    point_size: 6
  field_renderers:
    - keys: [elevation]
      label: "ELEVATION"
      format:
        type: integer
        suffix: " m"
      priority: 0
    - keys: [morphology]
      label: "TYPE"
      format:
        type: string
      priority: 1
    - keys: [status]
      label: "STATUS"
      format:
        type: string
        transform: upper
      priority: 2
    - keys: [vei]
      label: "VEI"
      format:
        type: integer
        prefix: "VEI "
      priority: 3
    - keys: [country]
      label: "COUNTRY"
      format:
        type: string
      priority: 4
    - keys: [location]
      label: "REGION"
      format:
        type: string
      priority: 5
    - keys: [last_eruption_year]
      label: "LAST ERUPTION"
      format:
        type: integer
      priority: 6

# --- History (per-layer time range limits) ---
history:
  max_lookback: "8760h"     # 365 days
  max_range_span: "720h"    # 30 days per query window
