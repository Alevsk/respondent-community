# sources.d/darkreading_news.yaml
# Dark Reading — enterprise cybersecurity news and analysis.
schema_version: 1

name: darkreading_news
source_type: darkreading_news
layer_type: news_articles
display_name: "Dark Reading"
enabled: true

transport:
  type: http_poll
  url: "https://www.darkreading.com/rss.xml"
  method: GET
  headers:
    Accept: "application/xml"
  timeout: "15s"
  interval: "1800s"

parser:
  format: rss
  max_records: 100

entity:
  external_id: >
    record.link
  name: >
    record.title
  metadata:
    source_url: >
      record.link
    description: >
      has(record.description) ? record.description : ""
    author: >
      has(record.author) ? record.author : ""
    country: >
      has(record.category) && size(record.category) > 0 ? record.category[0] : ""
    feed_source: >
      "darkreading"

observation:
  latitude: "0.0"
  longitude: "0.0"
  altitude: "0.0"
  timestamp: >
    has(record.pubDate) ? parse_rfc2822(record.pubDate) : now()
  velocity: {}
  metadata:
    description: >
      has(record.description) ? record.description : ""
  content_hash: >
    has(record.guid) ? record.guid : record.link

ai:
  enabled: true
  operations:
    - name: news_geo_enrichment
      prompt: |
        You are an OSINT analyst producing structured intelligence from news
        articles for a global situational awareness dashboard. Your output
        will be read by decision-makers who need rapid, accurate understanding
        of events worldwide.

        <article>
          <title>{{.Entity.Name}}</title>
          <description>{{index .Entity.Metadata "description"}}</description>
          <source_feed>{{index .Entity.Metadata "feed_source"}}</source_feed>
          <source>{{index .Entity.Metadata "source_url"}}</source>
        </article>

        Perform the following tasks in order:

        1. GEOLOCATE — Identify the most specific location this article
           covers. If you can confidently provide coordinates (e.g. a named
           city or specific site), include lat/lon. Otherwise leave them null
           and provide city/region/country text for geocoding.

        2. CLASSIFY — Assign a single primary category from the allowed enum
           that best describes the event type.

        3. ASSESS SEVERITY — Rate the operational significance:
           - low: routine reporting, periodic updates, no immediate impact
           - moderate: developing situation worth monitoring
           - high: significant event with humanitarian or security implications
           - critical: acute crisis requiring immediate attention

        4. SUMMARIZE — Write a concise 1-2 sentence intelligence summary of
           what is happening and why it matters. Focus on the situation, not
           on the source or publication metadata. Write for an analyst who
           has not read the article.

        5. IDENTIFY KEY ACTORS — List the principal organizations, armed
           groups, governments, or agencies involved (max 5).

        6. ESTIMATE AFFECTED POPULATION — Classify the scale of people
           affected using the allowed enum.

        <example>
        Input article: "North Korean hackers drain $285M from crypto exchange
        Drift in sophisticated supply chain attack"

        Output:
        {
          "lat": null,
          "lon": null,
          "city": null,
          "region": null,
          "country": "North Korea",
          "country_iso3": "PRK",
          "location_confidence": 0.6,
          "category": "cyber_attack",
          "severity": "high",
          "summary": "North Korean state-sponsored hackers stole $285M from cryptocurrency exchange Drift through a sophisticated supply chain compromise, marking one of the largest crypto heists attributed to the Lazarus Group.",
          "key_actors": ["Lazarus Group", "Drift Exchange", "FBI"],
          "affected_population": "moderate"
        }
        </example>

        Respond with JSON matching this schema:
        {{.OutputSchema}}
      output_schema:
        type: object
        required: [country, location_confidence, category, severity, summary]
        properties:
          lat: { type: [number, "null"], minimum: -90, maximum: 90 }
          lon: { type: [number, "null"], minimum: -180, maximum: 180 }
          city: { type: [string, "null"] }
          region: { type: [string, "null"] }
          country: { type: string }
          country_iso3: { type: [string, "null"] }
          location_confidence:
            type: number
            minimum: 0.0
            maximum: 1.0
          category:
            type: string
            enum:
              - armed_conflict
              - natural_disaster
              - humanitarian_crisis
              - food_insecurity
              - disease_outbreak
              - displacement
              - political_instability
              - terrorism
              - cyber_attack
              - data_breach
              - vulnerability
              - cyber_espionage
              - infrastructure
              - environmental
              - policy_report
              - other
          severity:
            type: string
            enum: [low, moderate, high, critical]
          summary:
            type: string
          key_actors:
            type: array
            items: { type: string }
          affected_population:
            type: string
            enum: [unknown, localized, moderate, large, massive]
      max_tokens: 500
      temperature: 0
      output:
        target: entity
        patch_coordinates:
          enabled: true
          lat_field: "lat"
          lon_field: "lon"
          confidence_field: "location_confidence"
          min_confidence: 0.7

recording:
  mode: dedupe

cache:
  ttl: "3600s"

display:
  icon:
    shape: diamond
    rotatable: false
    interpolation: false
    scale: 0.8
  style:
    color: "#ffa500"
    point_size: 6
  trail:
    color: "#ffa500"
    width: 1.0
    opacity: 0.6
  field_renderers:
    - keys: [feed_source]
      label: "SOURCE"
      format:
        type: string
        transform: upper
      priority: 0
    - keys: [author]
      label: "AUTHOR"
      format:
        type: string
      priority: 1
    - keys: [country]
      label: "TOPIC"
      format:
        type: string
        transform: upper
      priority: 2
    - keys: [description]
      label: "DESCRIPTION"
      format:
        type: string
      priority: 3
    - keys: [source_url]
      label: "URL"
      format:
        type: string
      priority: 4
    - keys: [severity]
      label: "SEVERITY"
      format:
        type: string
        transform: upper
      priority: 5
    - keys: [category]
      label: "CATEGORY"
      format:
        type: string
        transform: upper
      priority: 6
    - keys: [summary]
      label: "SUMMARY"
      format:
        type: string
      priority: 7
    - keys: [key_actors]
      label: "KEY ACTORS"
      format:
        type: string
      priority: 8
    - keys: [affected_population]
      label: "AFFECTED POPULATION"
      format:
        type: string
        transform: upper
      priority: 9
