# sources.d/TEMPLATE.yaml
# ============================================================================
# DECLARATIVE SOURCE TEMPLATE — COMPLETE REFERENCE
# ============================================================================
# Copy this file and rename it to match your source (e.g., my_new_source.yaml).
# Fields marked <REQUIRED> must be filled in. Commented-out fields are optional.
#
# Validate your source before deploying:
#   ./feeder validate sources.d/my_new_source.yaml
#
# This file is disabled (enabled: false) so the loader skips it.
# ============================================================================

# Schema version. Use 2 for filtering, geo_cache, spatial crawling, entity_cache,
# on_demand_url, and advanced parser options (array_columns, object_to_records, etc).
# Version 1 is legacy — new sources should always use 2.
schema_version: 2

# Unique source identifier. Lowercase + underscores only, max 64 chars.
# Must match: ^[a-z][a-z0-9_]{0,63}$
# This becomes the key in the ingestion service and must not collide with
# existing source names (check other files in sources.d/).
name: <REQUIRED>

# Optional labels for categorization and filtering.
labels:
  category: "<REQUIRED>"   # e.g., environmental, disaster, military, transportation, space
  priority: "medium"       # low | medium | high

# --- Identity ---
# source_type: maps to domain.SourceType for the ingest registry.
#   Convention: same as `name` unless you have a reason to differ.
source_type: <REQUIRED>

# layer_type: groups entities on the globe. Multiple sources can feed one layer.
#   Examples: earthquakes, flights_commercial, satellites, fires_active, ships
layer_type: <REQUIRED>

# Human-readable name shown in the frontend layer picker.
display_name: "<REQUIRED>"

# entity_type: controls how the frontend renders entities from this source.
#   Omit (or leave commented out) for the default: "geo_entity" — spatial points
#   on the 3D globe with lat/lon coordinates.
#
#   Set to "global_indicator" for a singleton entity with no position, rendered
#   as a HUD overlay panel. When using global_indicator:
#     - observation.latitude and observation.longitude must be omitted
#     - An "indicator" spec (see Indicator section below) is required
#     - display.style.point_size should be set to 1 (no globe marker is rendered)
#
# entity_type: global_indicator

# --- Operational Controls ---
# Set to false to disable this source without deleting the file.
enabled: false

# Set to true to fetch+parse+log but NOT persist to DB/cache.
# Useful for testing a new source without polluting production data.
# dry_run: false

# --- Spatial Filtering (schema_version: 2) ---
# Controls how the frontend subscribes to this layer and how the backend
# returns entity data.
#
#   viewport  -> frontend sends camera bounds; backend uses GEOSEARCH on the
#                geo sorted set (max 2000 entities per subscribe).
#                Use when entity count > 2000 (e.g., flights, fires, ships, satellites).
#
#   all       -> same as global mode; explicit opt-in to fetch all entities.
#
#   (omit)    -> frontend subscribes in global mode; backend returns all entities
#                from the layer index (max 5000, paginated up to 10000).
#                Use when entity count < 2000 (e.g., earthquakes, buoys).
#
# GUIDELINE: Check the entity count for your layer. If > 2000, use viewport filtering.
# In the community edition (SQLite + MemCache), viewport filtering uses linear
# bbox filtering (O(n)) — still functional but slower than Valkey's GEOSEARCH.
#
# filtering: viewport

# --- Backfill (schema_version: 2, spatial sources only) ---
# When a spatial region has fewer entities than the threshold, the scheduler
# back-fills by prioritizing that region in the next fetch cycle.
#
# backfill:
#   threshold: 10              # Trigger backfill when region has fewer than N entities

# --- Lookup Tables (schema_version: 2) ---
# Static lookup tables for CEL enrichment. Tables are loaded and indexed at
# config time; CEL expressions reference them via:
#   lookup("table_name", key_value, "field_name")
#
# lookup_tables:
#   - name: country_codes       # Unique table identifier (lowercase + underscore, max 64)
#     key_field: code            # Primary key field name
#     # Inline entries (use ONE of entries or file, not both):
#     entries:
#       - code: US
#         name: "United States"
#         region: "North America"
#       - code: GB
#         name: "United Kingdom"
#         region: "Europe"
#     # External file (use ONE of entries or file, not both):
#     # file: "data/country_codes.json"    # Path relative to working directory
#     # format: json                       # json | csv

# --- Ingestion ---
transport:
  # Supported transport types:
  #   http_poll    -> periodic HTTP requests (most common)
  #   websocket    -> persistent WebSocket connection
  #   sse          -> Server-Sent Events stream
  #   mqtt         -> MQTT broker subscription
  #   webhook      -> inbound HTTP listener
  #   pubsub       -> cloud Pub/Sub (GCP) or Valkey/Redis Pub/Sub
  #   grpc_stream  -> gRPC server-streaming client
  #   kafka        -> Kafka consumer
  #   amqp         -> AMQP (RabbitMQ) consumer
  #   tcp_udp      -> raw TCP/UDP socket
  #   ftp_sftp     -> periodic FTP/SFTP file retrieval
  #   s3_poll      -> S3-compatible object polling
  #   nats         -> NATS/JetStream consumer
  type: http_poll

  # The API endpoint URL. Use ${ENV_VAR} for credentials embedded in URL path.
  # At load time, ${VAR} is expanded via the EnvResolver (looks up RESPONDENT_VAR env var).
  # For spatial sources, use {lat} and {lon} placeholders (e.g., "/lat/{lat}/lon/{lon}/dist/250").
  url: "<REQUIRED>"

  # On-demand URL (schema_version: 2 only).
  # Alternative URL used for single-point fetches (e.g., when the user clicks a
  # specific location). Uses {lat} and {lon} placeholders.
  # on_demand_url: "https://api.example.com/point/{lat}/{lon}/250"

  method: GET              # GET or POST

  # Static headers sent with every request.
  headers:
    Accept: "application/json"

  # --- Authentication (pick one pattern or omit if no auth needed) ---
  #
  # Pattern 1: Bearer token
  # auth:
  #   type: bearer
  #   env_var: "MY_API_TOKEN"       # Resolved from RESPONDENT_MY_API_TOKEN env var
  #
  # Pattern 2: API key in a custom header
  # auth:
  #   type: api_key
  #   header: "X-API-Key"           # Header name
  #   env_var: "MY_API_KEY"         # Resolved from RESPONDENT_MY_API_KEY env var
  #
  # Pattern 3: Credential in URL (no auth block needed)
  # url: "https://api.example.com/data/${MY_KEY}/endpoint"
  #
  # Pattern 4: OAuth2 token exchange
  # auth:
  #   type: oauth2
  #   oauth2:
  #     token_url: "https://auth.example.com/oauth/token"
  #     grant_type: client_credentials   # client_credentials | password
  #     credentials:
  #       # Each credential field accepts either a literal string or an env var:
  #       client_id:
  #         env_var: "MY_CLIENT_ID"      # Resolved from RESPONDENT_MY_CLIENT_ID
  #       client_secret:
  #         env_var: "MY_CLIENT_SECRET"  # Resolved from RESPONDENT_MY_CLIENT_SECRET
  #       # For password grant type:
  #       # username: "literal-username"    # Literal string value
  #       # password:
  #       #   env_var: "MY_PASSWORD"
  #     # Optional: customize how the token response is parsed (defaults shown):
  #     # response_mapping:
  #     #   access_token: "access_token"
  #     #   refresh_token: "refresh_token"
  #     #   expires_in: "expires_in"
  #     # Optional: customize how the token is sent on data requests:
  #     # token_header: "Authorization"    # Default: "Authorization"
  #     # token_prefix: "Bearer "          # Default: "Bearer "
  #     # Optional: refresh margin before expiry:
  #     # refresh_before_expiry: "300s"    # Default: 300s
  #     # Optional: extra form fields included in token requests:
  #     # extra_params:
  #     #   audience: "https://api.example.com"

  timeout: "15s"           # HTTP request timeout
  interval: "60s"          # Polling interval (how often to re-fetch)
  max_response_bytes: 10485760  # 10MB. Max: 104857600 (100MB).

  # Retry configuration (optional but recommended).
  retry:
    max_attempts: 3        # Number of retries (0-10; total attempts = max_attempts + 1)
    backoff: "exponential" # exponential | fixed
    initial_delay: "2s"
    max_delay: "30s"

  # --- Pagination (optional) ---
  # Uncomment one of these patterns if the API paginates results.
  #
  # Page-number pagination (page=1, page=2, ...):
  # pagination:
  #   type: page_number
  #   page_param: "page"          # Query parameter name for page number
  #   size_param: "per_page"      # Query parameter name for page size (optional)
  #   size: 100                   # Items per page (1-10000)
  #   max_pages: 10               # Stop after N pages (1-1000)
  #   # Optional: stop early with a CEL expression. Variable: records (current page array).
  #   stop_when: "size(records) < 100"
  #
  # Offset pagination (offset=0, offset=100, ...):
  # pagination:
  #   type: offset
  #   page_param: "offset"        # Query parameter name for offset
  #   size_param: "limit"         # Query parameter name for limit (optional)
  #   size: 100                   # Items per page
  #   max_pages: 10               # Stop after N pages
  #
  # Cursor pagination:
  # pagination:
  #   type: cursor
  #   page_param: "cursor"        # Query parameter name for cursor
  #   size_param: "limit"         # Query parameter name for limit (optional)
  #   size: 100                   # Items per page
  #   max_pages: 10               # Stop after N pages
  #   cursor_path: "meta.next_cursor"  # Dot-path to extract next cursor from JSON response

  # --- Spatial Crawling (schema_version: 2 only) ---
  # For APIs that require lat/lon parameters (e.g., adsb.lol, SondeHub).
  # The URL must contain {lat} and {lon} placeholders.
  #
  # Hex grid (automatic global coverage):
  # spatial:
  #   type: hex_grid              # hex_grid | static_regions
  #   radius_nm: 250              # Hex cell radius in nautical miles (10-5000)
  #   target_refresh: "30s"       # Target time to complete one full scan
  #   batch_size: 10              # Regions per fetch cycle (0 = auto-calculate, max 500)
  #   viewport_priority: true     # Prioritize regions the user is looking at
  #   priority_cap_pct: 30        # Max % of batch reserved for priority regions (0-100)
  #   lat_min: -60                # Skip regions below this latitude (-90 to 90)
  #   lat_max: 75                 # Skip regions above this latitude (-90 to 90)
  #
  # Static regions (fixed list of known locations):
  # spatial:
  #   type: static_regions
  #   regions:
  #     - lat: 40.7128
  #       lon: -74.0060
  #       label: "New York"
  #     - lat: 51.5074
  #       lon: -0.1278
  #       label: "London"

  # --- WebSocket Transport ---
  # Required when type: websocket. Persistent connection with optional subscribe messages.
  #
  # websocket:
  #   subprotocols: []              # WebSocket subprotocols to negotiate
  #   subscribe_messages:           # Messages sent after connection opens
  #     - '{"type":"subscribe","channel":"data"}'
  #   ping_interval: "30s"          # Heartbeat ping interval
  #   message_format: text          # text | binary
  #   compression: false            # Enable WebSocket compression
  #   origin: "https://example.com" # Origin header value
  #   decode: lzw                   # Application-level decoding: lzw (e.g., Blitzortung)

  # --- SSE Transport ---
  # Required when type: sse. Server-Sent Events stream.
  #
  # sse:
  #   last_event_id: false          # Resume from last event ID on reconnect
  #   event_filter:                 # Only process these event types (empty = all)
  #     - "message"
  #     - "update"

  # --- MQTT Transport ---
  # Required when type: mqtt. MQTT broker subscription.
  #
  # mqtt:
  #   broker: "tcp://broker.example.com:1883"    # Broker address
  #   topics:                                     # Topic subscriptions (required, min 1)
  #     - topic: "sensors/+/data"                 # MQTT topic with wildcards
  #       qos: 1                                  # Per-topic QoS override (0-2)
  #   client_id: "respondent-source"              # MQTT client ID
  #   qos: 1                                      # Default QoS level (0-2)
  #   clean_session: true                          # Clean session flag
  #   version: "3.1.1"                             # MQTT version: 3.1.1 | 5
  #   keep_alive: 60                               # Keep-alive in seconds (10-3600)
  #   username: ""                                 # MQTT auth
  #   password: ""                                 # MQTT auth
  #   tls:                                         # Optional TLS config
  #     ca_cert: "/path/to/ca.pem"
  #     client_cert: "/path/to/client.pem"
  #     client_key: "/path/to/client-key.pem"
  #     insecure_skip_verify: false

  # --- Webhook Transport ---
  # Required when type: webhook. Inbound HTTP listener for push-style sources.
  #
  # webhook:
  #   listen_addr: ":9090"                         # Listener address
  #   path: "/webhooks/my-source"                  # HTTP path for incoming requests
  #   secret: ""                                   # HMAC secret for signature verification
  #   signature_header: "X-Hub-Signature-256"      # Header containing the HMAC signature
  #   signature_algorithm: sha256                  # sha256 | sha1
  #   max_body_bytes: 10485760                     # Max request body size (1024-104857600)
  #   allowed_ips:                                 # IP whitelist (empty = allow all)
  #     - "192.168.1.0/24"
  #   tls:                                         # Optional TLS for the listener
  #     cert_file: "/path/to/cert.pem"
  #     key_file: "/path/to/key.pem"

  # --- Pub/Sub Transport ---
  # Required when type: pubsub. Cloud Pub/Sub (GCP) or Valkey/Redis Pub/Sub.
  #
  # pubsub:
  #   provider: gcp                              # gcp | valkey | redis
  #   # GCP-specific:
  #   project_id: "my-gcp-project"
  #   subscription_id: "my-subscription"
  #   max_outstanding_messages: 1000             # Message buffer size
  #   max_outstanding_bytes: 104857600           # Byte buffer size
  #   # Valkey/Redis-specific:
  #   # addr: "localhost:6379"
  #   # channels: ["events:*"]                  # Channel subscriptions
  #   # patterns: ["events:*"]                  # Pattern subscriptions
  #   # password: ""
  #   # db: 0
  #   ack_mode: auto                             # auto | manual

  # --- gRPC Stream Transport ---
  # Required when type: grpc_stream. gRPC server-streaming client.
  #
  # grpc_stream:
  #   address: "grpc.example.com:443"            # gRPC server address
  #   service: "my.package.MyService"            # Fully-qualified service name
  #   method: "StreamData"                       # RPC method name
  #   request_json: '{"filter":"active"}'        # Request payload as JSON string
  #   use_tls: true                              # Enable TLS
  #   tls:                                       # Optional TLS config (see MQTT)
  #     ca_cert: "/path/to/ca.pem"
  #   metadata:                                  # gRPC metadata headers
  #     authorization: "Bearer ${MY_TOKEN}"

  # --- Kafka Transport ---
  # Required when type: kafka. Kafka consumer.
  #
  # kafka:
  #   brokers:                                   # Broker addresses (required, min 1)
  #     - "kafka1.example.com:9092"
  #     - "kafka2.example.com:9092"
  #   topic: "events"                            # Topic to consume
  #   group_id: "respondent-consumer"            # Consumer group ID
  #   start_offset: earliest                     # earliest | latest (initial offset)
  #   max_bytes: 10485760                        # Max fetch bytes
  #   commit_interval: "5s"                      # Offset commit frequency
  #   sasl:                                      # SASL authentication
  #     mechanism: SCRAM-SHA-256                  # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
  #     username: "user"
  #     password: "pass"
  #   tls:                                       # Optional TLS config (see MQTT)
  #     insecure_skip_verify: false

  # --- AMQP Transport ---
  # Required when type: amqp. AMQP (RabbitMQ) consumer.
  #
  # amqp:
  #   url: "amqp://user:pass@rabbitmq.example.com:5672/"
  #   queue: "events"                            # Queue name
  #   exchange: "events-exchange"                # Exchange name
  #   routing_key: "events.#"                    # Routing key
  #   exchange_type: topic                       # direct | fanout | topic | headers
  #   prefetch_count: 100                        # QoS prefetch (1-10000)
  #   auto_ack: false                            # Auto-acknowledge messages
  #   tls:                                       # Optional TLS config (see MQTT)
  #     insecure_skip_verify: false

  # --- TCP/UDP Transport ---
  # Required when type: tcp_udp. Raw TCP or UDP socket.
  #
  # tcp_udp:
  #   protocol: tcp                              # tcp | udp
  #   mode: connect                              # connect (outbound) | listen (inbound)
  #   address: "data.example.com:5000"           # Socket address
  #   delimiter: "\n"                            # Message delimiter (e.g., newline)
  #   max_message_bytes: 65536                   # Message size limit (64-10485760)
  #   buffer_size: 65536                         # Socket buffer size

  # --- FTP/SFTP Transport ---
  # Required when type: ftp_sftp. Periodic file retrieval.
  #
  # ftp_sftp:
  #   protocol: sftp                             # ftp | sftp
  #   host: "ftp.example.com:22"                 # Server hostname and port
  #   path: "/data/exports/"                     # Remote directory
  #   file_pattern: "*.json"                     # Glob pattern for files
  #   username: "user"                           # Auth username
  #   password: ""                               # Auth password (or use private_key for SFTP)
  #   private_key: "/path/to/id_rsa"             # SSH private key (SFTP only)
  #   delete_after_fetch: false                  # Remove files after download
  #   track_seen: true                           # Skip already-seen files

  # --- S3 Poll Transport ---
  # Required when type: s3_poll. S3-compatible object polling.
  #
  # s3_poll:
  #   endpoint: "https://s3.amazonaws.com"       # S3 endpoint URL
  #   bucket: "my-data-bucket"                   # Bucket name
  #   prefix: "exports/"                         # Object key prefix
  #   region: "us-east-1"                        # AWS region
  #   access_key: ""                             # AWS access key (or use IAM role)
  #   secret_key: ""                             # AWS secret key
  #   delete_after_fetch: false                  # Remove objects after download
  #   since_last_modified: "24h"                 # Only fetch objects modified within this window
  #   file_pattern: "*.json"                     # Glob pattern for object keys
  #   path_style: false                          # Use path-style URLs (for MinIO, etc.)

  # --- NATS Transport ---
  # Required when type: nats. NATS/JetStream consumer.
  #
  # nats:
  #   url: "nats://nats.example.com:4222"        # NATS server URL
  #   subject: "events.>"                        # Subject to subscribe
  #   queue: "respondent-workers"                # Queue group name (load balancing)
  #   creds_file: "/path/to/nats.creds"          # Credentials file path
  #   token: ""                                  # Auth token
  #   tls:                                       # Optional TLS config (see MQTT)
  #     insecure_skip_verify: false
  #   # JetStream consumer (for durable, at-least-once delivery):
  #   jetstream:
  #     stream: "EVENTS"                         # Stream name
  #     consumer: "respondent"                   # Consumer name
  #     deliver_policy: new                      # all | last | new | by_start_time
  #     ack_wait: "30s"                          # Ack timeout
  #     max_deliver: 5                           # Max delivery attempts (1-100)

  # --- Streaming Behavior (for long-lived transports: websocket, sse, mqtt, etc.) ---

  # Batching controls how streaming messages are accumulated before processing.
  # batching:
  #   mode: window                # per_message (process each immediately) | window (accumulate)
  #   window: "3s"                # Accumulation window (only for mode: window)
  #   max_size: 1000              # Max messages per batch (1-100000)

  # Reconnect behavior for long-lived transports.
  # reconnect:
  #   max_attempts: 0             # Max reconnect attempts (0 = infinite)
  #   backoff: exponential        # exponential | fixed
  #   initial_delay: "2s"         # Starting delay
  #   max_delay: "60s"            # Cap on delay
  #   reset_after: "10m"          # Reset backoff counter after this duration of stability

# --- Response Parsing ---
parser:
  # Supported formats:
  #   json       -> standard JSON array or object
  #   json_table -> JSON where keys are IDs and values are objects (see object_to_records)
  #   geojson    -> GeoJSON FeatureCollection (records_path defaults to "features")
  #   csv        -> comma/tab-separated values
  #   tle        -> Two-Line Element set (satellite orbital data)
  #   xml        -> XML document
  #   rss        -> RSS/Atom feed
  format: json

  # Dot-separated path to the array of records in the response.
  # Examples:
  #   "features"           -> response.features (GeoJSON)
  #   "data.items"         -> response.data.items (nested)
  #   "member"             -> response.member (TLE API style)
  #   ""                   -> response IS the array (omit this field)
  # Path segments must match: ^[a-zA-Z0-9_]+$, max depth 8.
  records_path: ""

  max_records: 10000       # Safety cap (1-100000).

  # --- CSV-specific options (only when format: csv) ---
  # csv_options:
  #   delimiter: ","             # Field delimiter (default: ",")
  #   has_header: true           # First row is header (default: false)
  #   skip_lines: 0              # Skip N lines before parsing
  #   collapse_whitespace: false # Collapse consecutive whitespace in fields
  #   comment_prefix: "#"        # Lines starting with this are ignored

  # --- Array columns (schema_version: 2) ---
  # Map array indices to named fields. Use when the API returns arrays instead
  # of objects (e.g., OpenSky returns [icao24, callsign, origin_country, ...]).
  # The Nth entry in array_columns becomes the field name for index N.
  # array_columns:
  #   - icao24
  #   - callsign
  #   - origin_country
  #   - time_position

  # --- JSON reshaping (schema_version: 2) ---
  #
  # object_to_records: Convert a top-level JSON object {"key": {...}, ...} into an
  # array of its values [{...}, ...]. Useful for dictionary-keyed APIs.
  # Example: SondeHub /sondes returns {"serial": {...}, ...}
  # object_to_records: true
  #
  # object_key_field: When object_to_records is true, inject the object key into
  # each record under this field name.
  # object_key_field: "serial"
  #
  # array_of_arrays: Treat a JSON array-of-arrays as a table where the first row
  # is column headers and subsequent rows are data. Converts to array-of-objects.
  # Useful for APIs like NOAA SWPC: [["col1","col2"],[val1,val2],...]
  # array_of_arrays: true

# --- Record Filtering (CEL) ---
# Optional CEL expression that must return true for a record to be processed.
# The `record` variable is bound to each parsed record (a map).
#
# Common patterns:
#   - Field existence:  has(record.lat) && has(record.lon)
#   - Null check:       has(record.lat) && record.lat != null
#   - Numeric filter:   double(record.magnitude) >= 2.0
#   - String filter:    record.status != "inactive"
#   - Combined:         has(record.geo) && record.confidence != "low"
#   - TLE/SGP4:         has(record.line1) && has(record.line2) && sgp4_lat(record.line1, record.line2) != 0.0
#
# Available CEL functions:
#   has(field)                                -> field existence check
#   size(list)                                -> list length
#   string(val), int(val), double(val)        -> type coercion
#   coerce_double(val, default)               -> safe double conversion with fallback
#   sgp4_lat/sgp4_lon/sgp4_alt_m/sgp4_vel_mps -> TLE orbital propagation
#   lookup("table", key, "field")             -> lookup table query
#
# IMPORTANT: Use has() to guard optional fields. Without it, accessing a missing
# field causes a runtime error that skips the record silently.
filter: ""

# --- Entity Mapping (CEL) ---
# Maps each record to a domain Entity. All expressions receive `record` as input.
entity:
  # Unique identifier within this layer. Must be stable across polls.
  # Tip: use a composite key if the API has no single unique ID.
  # Examples:
  #   record.id                                           -> simple ID
  #   string(record.eventid)                              -> numeric to string
  #   record.lat + "_" + record.lon + "_" + record.date   -> composite key
  external_id: >
    <REQUIRED>

  # Human-readable name for display in the UI.
  name: >
    <REQUIRED>

  # Optional metadata key-value pairs (all values must be CEL expressions returning strings).
  # These appear in the entity detail panel.
  metadata:
    # example_field: >
    #   has(record.some_field) ? record.some_field : ""

# --- Observation Mapping (CEL) ---
# Maps each record to a domain Observation (position + time snapshot).
observation:
  # Latitude and longitude (must evaluate to float64).
  # Common patterns:
  #   double(record.lat)                    -> string to double
  #   record.geometry.coordinates[1]        -> GeoJSON [lon, lat]
  #   record.position.latitude              -> nested object
  #
  # NOTE: omit latitude and longitude entirely when entity_type is "global_indicator".
  latitude: >
    <REQUIRED>
  longitude: >
    <REQUIRED>

  # Altitude in meters (optional, defaults to 0).
  altitude: "0.0"

  # Timestamp of the observation. Must evaluate to a CEL timestamp.
  # Available time functions:
  #   now()                                  -> current time (use as fallback only)
  #   unix_ms(record.time)                   -> epoch milliseconds (int)
  #   unix_s(record.timestamp)               -> epoch seconds (int)
  #   parse_rfc3339(record.date)             -> "2024-01-01T00:00:00Z"
  #   parse_iso8601(record.date)             -> "2024-01-01T00:00:00" (appends Z if no tz)
  #   parse_datetime(record.date, "layout")  -> Go time layout (e.g., "2006-01-02 15:04:05")
  timestamp: >
    <REQUIRED>

  # Event time range (optional). Used for time-bounded events (e.g., weather alerts,
  # conflict events). Must evaluate to CEL timestamps.
  # event_time: >
  #   parse_rfc3339(record.start_time)
  # event_end: >
  #   parse_rfc3339(record.end_time)

  # Velocity components (optional). Keys are arbitrary; common: speed, heading, climb.
  # All values must be CEL expressions returning strings.
  velocity: {}
    # speed: >
    #   has(record.speed) ? string(record.speed) : "0"
    # heading: >
    #   has(record.heading) ? string(record.heading) : "0"
    # climb: >
    #   has(record.vertical_rate) ? string(record.vertical_rate) : "0"

  # Observation metadata (optional). Same rules as entity metadata.
  metadata: {}
    # status: >
    #   has(record.status) ? record.status : ""

  # Content hash for deduplication (required when recording.mode is "dedupe").
  # Should produce a unique string for each distinct observation state.
  # Example: record.lat + "_" + record.lon + "_" + record.brightness
  content_hash: ""

# --- Field Mappings (advanced) ---
# Generalized CEL mappings from source data to domain structures.
# Use for custom data transformation beyond entity/observation mapping.
#
# field_mappings:
#   - source: "record.event_time"           # CEL expression
#     target: "event_start"                  # Target domain field
#     type: timestamp                        # timestamp | string | integer | float | boolean

# --- Recording ---
recording:
  # How observations are persisted:
  #   append  -> always insert a new row (time-series style)
  #   upsert  -> insert or update based on entity_id (latest-only)
  #   dedupe  -> insert only if content_hash differs from latest (requires content_hash)
  mode: append

# --- Cache ---
cache:
  # TTL for the hot cache (Valkey in production, MemCache in community edition).
  # Controls how long entities remain visible on the globe after the last successful
  # fetch. Set higher than interval to survive a few missed polls.
  ttl: "120s"

# --- Entity Cache (schema_version: 2 only) ---
# Accumulates entities across spatial batches. Different from cache.ttl above:
#   cache.ttl        -> hot cache TTL (globe visibility)
#   entity_cache.ttl -> in-memory accumulation TTL (cross-batch dedup for spatial sources)
#
# entity_cache:
#   enabled: true
#   key: "record.hex"          # CEL expression for cache key
#   ttl: "120s"                # How long to keep an entity in the accumulation cache
#   accumulate: true           # Merge entities across spatial batches

# --- Geo Cache (required when filtering: viewport) ---
# Controls geo sorted set maintenance for viewport-filtered layers.
# Must be set alongside `filtering: viewport` — without it, the geo index
# accumulates stale entries that degrade GEOSEARCH result quality over time.
#
# geo_cache:
#   overfetch_ratio: 3.0          # Fetch 3x members to find enough alive ones (1.0-10.0)
#   alive_ratio_threshold: 0.5    # Trigger GC when <50% of results are alive (0.1-1.0)
#   gc_batch_size: 500            # Max dead members to prune per query (10-10000)

# --- History ---
# Per-layer time range limits for historical exploration.
# When present, the frontend custom range picker and backend WebSocket handler
# use these limits instead of the server defaults (48h lookback, 24h span).
#
# history:
#   max_lookback: "8760h"         # Max historical lookback (e.g., "8760h" = 1 year)
#   max_range_span: "168h"        # Max time range span (e.g., "168h" = 1 week)

# --- Indicator (global_indicator entity_type only) ---
# Required when entity_type is "global_indicator". Defines how obs_metadata fields
# are transformed into labeled numeric values with severity levels for the HUD panel.
#
# Data flow:
#   observation.metadata CEL expressions -> obs_metadata (flat string-to-string map)
#   -> each IndicatorValueSpec reads source_field from obs_metadata
#   -> level is computed (threshold, expr, or default strategy)
#   -> frontend renders label + formatted value + severity color
#
# indicator:
#   values:
#     - key: my_value              # Unique identifier (not displayed)
#       label: "My Value"          # Human-readable label shown in HUD panel
#       source_field: my_obs_key   # Key in obs_metadata holding the raw numeric string
#       unit: "pts"                # (Optional) Unit suffix appended after the value
#       max_level: 5               # Maximum severity level (result is clamped to this)
#
#       # Display formatting (all optional):
#       format: number             # Display format: scale | number | currency | percent
#       precision: 2               # Decimal places in formatted output
#       prefix: "$"                # String prepended to the formatted value
#
#       # Level strategy — choose ONE of the following three:
#
#       # Strategy 1: threshold-based. List length must equal max_level.
#       # Level = number of thresholds the parsed value exceeds (ascending order).
#       level_thresholds: [12, 18, 25, 35, 45]
#
#       # Strategy 2: expression-based. CEL returning int.
#       # Variables: value (string from source_field), change_pct (string from change_source_field).
#       # Use math.abs() for symmetric magnitude-based levels.
#       # level_expr: >
#       #   int(math.abs(double(change_pct))) < 1 ? 0 :
#       #   int(math.abs(double(change_pct))) < 2 ? 1 :
#       #   int(math.abs(double(change_pct))) < 3 ? 2 :
#       #   int(math.abs(double(change_pct))) < 5 ? 3 :
#       #   int(math.abs(double(change_pct))) < 8 ? 4 : 5
#
#       # Strategy 3: default (omit both above). Parses value as int, clamps to max_level.
#       # Only use when the API field is already an integer severity scale (e.g., 0-5).
#
#       # change_source_field: my_change_pct_key
#       # (Optional) Key in obs_metadata holding the percentage change string.
#       # Binds to the change_pct variable in level_expr.
#
#   summary_expr: >
#     level >= 5 ? "Extreme" : level >= 3 ? "Elevated" : "Nominal"
#   # (Optional) CEL returning a summary string for the whole panel.
#   # Variables: level (int, max across all values), metadata (map[string]string, full obs_metadata).

# --- AI Enrichment (optional) ---
# When present and enabled, AI operations are validated at load time.
# Requires the global ai.enabled: true in the server config and an LLM provider.
#
# ai:
#   enabled: true
#   operations:
#     - name: enrich_metadata            # Unique operation name
#       tags: [enrichment]               # Optional tags for filtering/grouping
#       filter: ""                       # Optional CEL filter (which entities to process)
#       prompt: >                        # LLM prompt template (required)
#         Analyze the following entity and extract key attributes: {{ .Entity }}
#       output_schema:                   # JSON Schema for structured output (optional)
#         type: object
#         properties:
#           category:
#             type: string
#       output_mapping:                  # Map LLM result fields to entity/observation metadata
#         category: "category"
#       output_target: entity            # entity | observation (where results are stored)
#       batch:
#         size: 10                       # Batch size for bulk processing (1-100)
#         timeout: "30s"                 # Batch accumulation timeout
#       retry:
#         max_attempts: 3                # Retry failed LLM calls (0-10)
#         backoff: exponential           # exponential | fixed
#       cache_ttl: "24h"                 # Cache LLM results to avoid re-processing
#       priority: 0                      # Lower = higher priority
#       max_tokens: 1024                 # Max tokens for LLM response (1-128000)
#       temperature: 0.0                 # LLM temperature (0.0-2.0)
#       output:
#         store_insights: true           # Store results as AI insights
#         insight_type: "enrichment"     # Insight type for querying
#         websocket_push: true           # Push results to frontend via WebSocket
#         retention: "720h"              # Insight retention period
#         results_path: "result"         # Dot-path to results in LLM response
#         target: entity                 # Where to store: entity | observation
#         ref_fields:                    # Cross-layer entity references in LLM output
#           - field: related_entity_id   # Field in LLM result containing an external_id
#             layer_type: conflict_events # Layer to look up the reference in
#         patch_coordinates:             # Update entity position from LLM result
#           enabled: false
#           lat_field: latitude
#           lon_field: longitude
#           confidence_field: confidence
#           min_confidence: 0.8

# --- Display ---
# Frontend rendering configuration. Consumed by GetLayers() gRPC API.
display:
  icon:
    # Available shapes (57 total):
    #
    # Aviation:     flight, flight-alt-a, flight-alt-b, flight-alt-c, drone, helicopter
    # Space:        diamond, satellite (alias for diamond), iss, rocket, telescope, meteor
    # Maritime:     ship, anchor, wave
    # Military:     missile, tank, shield, crosshair, radar, explosion, bullseye
    # Weather:      lightning, cloud, wind, tornado, snowflake, hurricane, flood
    # Hazard:       warning, radiation, nuclear, biohazard, skull, fire, volcano
    # Seismic:      ripple, crack
    # Radio:        radio
    # Infrastructure: tower, building, bridge, factory, powerplant, crane, warehouse
    # Geometry:     dot, star, hexagon, circle-ring, chevron, triangle, pentagon, cross
    # Other:        marker, tree
    #
    # Use "dot" as the default/fallback shape. Unknown shapes also fall back to dot.
    shape: dot
    rotatable: false         # Rotate icon with entity heading (e.g., aircraft)
    interpolation: false     # Interpolate position between updates (smooth movement)
    scale: 1.0               # Size multiplier (0.1-5.0; 1.0 = standard)
  trail:
    color: "#ffffff"         # Hex color for entity trail (#rrggbb)
    width: 1.5               # Trail line width (0.5-10.0)
    opacity: 0.7             # Trail transparency (0.0-1.0)
  style:
    color: "#ffffff"         # Entity color on the globe (#rrggbb)
    point_size: 6            # Base point size (1-32; 8 = standard)
  # Field renderers define how metadata fields appear in the entity detail panel.
  # Renderers are sorted by priority (lower = shown first).
  field_renderers:
    []
    # - keys: [magnitude]     # Metadata key(s) to match (from entity.metadata or observation.metadata)
    #   label: "MAGNITUDE"    # Display label
    #   format:
    #     type: float          # string | float | integer | raw
    #     precision: 1         # Decimal places (float only)
    #     prefix: "M"          # Prefix before value
    #     suffix: " units"     # Suffix after value
    #     transform: upper     # upper | lower (string only)
    #   priority: 0            # Sort order (lower = higher priority)
