# sources.d/epa_radnet.yaml
# EPA RadNet — US Radiation Air Monitoring Network
# Source: EPA Envirofacts REST API (ERM_SAMPLE table)
# Auth: None required (public government data)
# Format: JSON flat array from Envirofacts service
#
# The Envirofacts API serves individual tables without joins. ERM_SAMPLE contains
# sample collection records with loc_num (location ID), mat_id (medium), and
# collect_start (date). Coordinates are NOT in the API response — a lookup table
# maps loc_num to city centroid lat/lon for the ~140 active fixed air monitors.
#
# Near-real-time gamma data is available per-station at:
#   https://radnet.epa.gov/cdx-radnet-rest/api/rest/csv/{year}/fixed/{state}/{city}
# but that requires per-station polling which doesn't fit the declarative model.
schema_version: 1

name: epa_radnet
labels:
  category: "nuclear"
  priority: "high"

# --- Identity ---
source_type: epa_radnet
layer_type: radiation_us
display_name: "EPA RadNet"

# --- Operational Controls ---
enabled: true

# Static coordinate lookup for RadNet fixed air monitoring stations.
# Coordinates are city centroids — the EPA historically tracked stations by
# city centroid rather than exact GPS coordinates.
# This covers the primary fixed air monitors across all 50 states + DC + PR.
