transport:
  type: http_poll
  # Query ERM_SAMPLE for recent air filter samples (mat_id = AIR-CHARCOAL or AIR-PARTICULATE).
  # The Envirofacts API returns a flat JSON array. Sorted by most recent first.
  # Rows 0:200 fetches up to 200 most recent sample records.
  url: "https://data.epa.gov/efservice/ERM_SAMPLE/mat_id/AIR-CHARCOAL/ROWS/0:200/JSON"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "30s"
  interval: "3600s"  # 1 hour
  max_response_bytes: 5242880  # 5MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "5s"
    max_delay: "60s"

# --- Response Parsing ---
# Envirofacts returns a flat JSON array: [{...}, {...}, ...]
parser:
  format: json
  max_records: 5000

# --- Record Filtering (CEL) ---
# Only process samples from stations we have coordinates for
filter: >
  has(record.loc_num) && has_lookup("stations", string(record.loc_num))

# --- Entity Mapping (CEL) ---
entity:
  external_id: >
    "radnet_" + string(record.loc_num)
  name: >
    lookup("stations", string(record.loc_num), "name")
  metadata:
    station_id: >
      string(record.loc_num)
    medium: >
      has(record.mat_id) ? record.mat_id : ""
    sample_id: >
      has(record.samp_id) ? string(record.samp_id) : ""
    project: >
      has(record.proj_num) ? string(record.proj_num) : ""

# --- Observation Mapping (CEL) ---
observation:
  latitude: >
    lookup("stations", string(record.loc_num), "lat")
  longitude: >
    lookup("stations", string(record.loc_num), "lon")
  altitude: "0.0"
  timestamp: >
    now()
  event_time: >
    parse_datetime(record.collect_start, "2006-01-02")
  velocity: {}
  metadata:
    medium: >
      has(record.mat_id) ? record.mat_id : ""
    sample_id: >
      has(record.samp_id) ? string(record.samp_id) : ""
    collection_date: >
      has(record.collect_start) ? record.collect_start : ""
    station_name: >
      lookup("stations", string(record.loc_num), "name")
  content_hash: >
    string(record.samp_num)

# --- Recording ---
recording:
  mode: dedupe  # Only record new samples (keyed by samp_num)

# --- Cache ---
cache:
  ttl: "7200s"  # 2 hours — survive a missed hourly poll

# --- Display ---
display:
  icon:
    shape: radiation
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ffcc00"
    width: 1.0
    opacity: 0.7
  style:
    color: "#ffcc00"
    point_size: 6
  field_renderers:
    - keys: [station_name]
      label: "STATION"
      format:
        type: string
      priority: 0
    - keys: [medium]
      label: "MEDIUM"
      format:
        type: string
        transform: upper
      priority: 1
    - keys: [collection_date]
      label: "COLLECTED"
      format:
        type: string
      priority: 2
    - keys: [sample_id]
      label: "SAMPLE ID"
      format:
        type: string
      priority: 3

# --- History ---
history:
  max_lookback: "8760h"   # 1 year
  max_range_span: "168h"  # 7 days per query window
