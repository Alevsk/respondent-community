# sources.d/gdacs_disasters.yaml
# GDACS — Global Disaster Alert and Coordination System (UN/EU)
# Source: https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH
# Auth: None required
# Format: GeoJSON FeatureCollection
schema_version: 1

name: gdacs_disasters
labels:
  category: disaster
  priority: high

# --- Identity ---
source_type: gdacs_disasters
layer_type: disaster_alerts
display_name: "GDACS Disaster Alerts"

# --- Ingestion ---
transport:
  type: http_poll
  url: "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventtype=EQ,TC,FL,VO,WF&alertlevel=Green,Orange,Red&limit=100"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "15s"
  interval: "900s"  # 15 minutes
  max_response_bytes: 10485760  # 10MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "2s"
    max_delay: "30s"

# --- Response Parsing ---
# GDACS returns GeoJSON FeatureCollection with features array.
parser:
  format: geojson
  records_path: "features"
  max_records: 1000

# --- Record Filtering (CEL) ---
filter: >
  has(record.geometry) && has(record.geometry.coordinates)
  && size(record.geometry.coordinates) >= 2

# --- Entity Mapping (CEL) ---
entity:
  external_id: >
    has(record.properties.eventid)
      ? record.properties.eventtype + "_" + string(record.properties.eventid)
      : string(record.geometry.coordinates[0]) + "_" + string(record.geometry.coordinates[1])
  name: >
    has(record.properties.name) && record.properties.name != "" ? record.properties.name : "GDACS Event"
  metadata:
    eventtype: >
      has(record.properties.eventtype) ? record.properties.eventtype : ""
    alertlevel: >
      has(record.properties.alertlevel) ? record.properties.alertlevel : ""
    severity: >
      has(record.properties.severitydata) && has(record.properties.severitydata.severitytext)
        ? record.properties.severitydata.severitytext
        : ""
    country: >
      has(record.properties.country) ? record.properties.country : ""

# --- Observation Mapping (CEL) ---
observation:
  latitude: >
    record.geometry.coordinates[1]
  longitude: >
    record.geometry.coordinates[0]
  altitude: "0.0"
  # GDACS fromdate is ISO 8601 without timezone (e.g., "2026-03-11T07:55:18").
  # parse_iso8601 appends "Z" (UTC) when no timezone is present.
  timestamp: >
    has(record.properties.fromdate) ? parse_iso8601(record.properties.fromdate) : now()
  velocity: {}
  metadata:
    alertlevel: >
      has(record.properties.alertlevel) ? record.properties.alertlevel : ""
    eventtype: >
      has(record.properties.eventtype) ? record.properties.eventtype : ""
  content_hash: >
    (has(record.properties.eventid) ? string(record.properties.eventid) : "") + "_" + (has(record.properties.alertlevel) ? record.properties.alertlevel : "") + "_" + (has(record.properties.severitydata) && has(record.properties.severitydata.severitytext) ? record.properties.severitydata.severitytext : "")

# --- Recording ---
recording:
  mode: dedupe

# --- Cache ---
cache:
  ttl: "3600s"

# --- Display ---
display:
  icon:
    shape: warning
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff0000"
    width: 1.5
    opacity: 0.8
  style:
    color: "#ff0000"
    point_size: 6
  field_renderers:
    - keys: [eventtype]
      label: "HAZARD TYPE"
      format:
        type: string
        transform: upper
      priority: 0
    - keys: [alertlevel]
      label: "ALERT LEVEL"
      format:
        type: string
        transform: upper
      priority: 1
    - keys: [severity]
      label: "SEVERITY"
      format:
        type: string
      priority: 2
    - keys: [country]
      label: "COUNTRY"
      format:
        type: string
      priority: 3

# --- History (per-layer time range limits) ---
history:
  max_lookback: "2160h"    # 90 days
  max_range_span: "168h"   # 7 days per query window
