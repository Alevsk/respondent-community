# sources.d/aviationweather_sigmets.yaml
# SIGMETs and AIRMETs from the FAA Aviation Weather Center.
# API docs: https://aviationweather.gov/data/api/
# Returns active SIGMETs (significant meteorological information) including
# turbulence, icing, convective activity, volcanic ash, and other hazards.
schema_version: 1

name: aviationweather_sigmets
labels:
  category: aviation
  priority: medium

# --- Identity ---
source_type: aviationweather_sigmets
layer_type: aviation_weather
display_name: "Aviation SIGMETs"

# --- Ingestion ---
transport:
  type: http_poll
  url: "https://aviationweather.gov/api/data/airsigmet?format=json"
  method: GET
  headers:
    Accept: "application/json"
    User-Agent: "Respondent/1.0"
  timeout: "15s"
  interval: "600s"  # 10 minutes — SIGMETs issue on FAA cycles
  max_response_bytes: 10485760  # 10MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "2s"
    max_delay: "30s"

# --- Response Parsing ---
# The API returns a top-level JSON array of SIGMET/AIRMET objects.
parser:
  format: json
  records_path: ""
  max_records: 5000

# --- Record Filtering (CEL) ---
# Require at least one coordinate pair for map placement.
filter: >
  has(record.coords) && size(record.coords) > 0 && has(record.coords[0].lat) && has(record.coords[0].lon)

# --- Entity Mapping (CEL) ---
entity:
  external_id: >
    record.icaoId + "_" + record.alphaChar + "_" + string(record.validTimeFrom)
  name: >
    record.airSigmetType + " " + record.hazard + " (" + record.icaoId + " " + record.alphaChar + ")"
  metadata:
    hazard: >
      has(record.hazard) ? record.hazard : ""
    sigmet_type: >
      has(record.airSigmetType) ? record.airSigmetType : ""
    severity: >
      has(record.severity) ? string(record.severity) : ""
    altitude_low: >
      has(record.altitudeLow1) ? string(record.altitudeLow1) : ""
    altitude_high: >
      has(record.altitudeHi2) ? string(record.altitudeHi2) : has(record.altitudeHi1) ? string(record.altitudeHi1) : ""
    icao_id: >
      has(record.icaoId) ? record.icaoId : ""
    series_id: >
      has(record.seriesId) ? record.seriesId : ""
    movement_dir: >
      has(record.movementDir) ? string(record.movementDir) : ""
    movement_spd: >
      has(record.movementSpd) ? string(record.movementSpd) : ""
    raw_text: >
      has(record.rawAirSigmet) ? record.rawAirSigmet : ""

# --- Observation Mapping (CEL) ---
# Use the first coordinate pair (centroid approximation) for point placement.
observation:
  latitude: >
    double(record.coords[0].lat)
  longitude: >
    double(record.coords[0].lon)
  altitude: >
    has(record.altitudeHi2) ? double(record.altitudeHi2) * 0.3048 : 0.0
  timestamp: >
    unix_s(record.validTimeFrom)
  velocity:
    heading: >
      has(record.movementDir) ? double(record.movementDir) : 0.0
    speed: >
      has(record.movementSpd) ? double(record.movementSpd) : 0.0
  metadata:
    hazard: >
      has(record.hazard) ? record.hazard : ""
    severity: >
      has(record.severity) ? string(record.severity) : ""
  content_hash: ""

# --- Recording ---
recording:
  mode: upsert

# --- Cache ---
cache:
  ttl: "900s"

# --- Display (consumed by frontend) ---
display:
  icon:
    shape: warning
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff9800"
    width: 1.5
    opacity: 0.7
  style:
    color: "#ff9800"
    point_size: 6
  field_renderers:
    - keys: [hazard]
      label: "HAZARD"
      format:
        type: string
        transform: upper
      priority: 0
    - keys: [sigmet_type]
      label: "TYPE"
      format:
        type: string
        transform: upper
      priority: 1
    - keys: [severity]
      label: "SEVERITY"
      format:
        type: integer
      priority: 2
    - keys: [altitude_low]
      label: "ALT LOW"
      format:
        type: integer
        suffix: " ft"
      priority: 3
    - keys: [altitude_high]
      label: "ALT HIGH"
      format:
        type: integer
        suffix: " ft"
      priority: 4
    - keys: [icao_id]
      label: "ICAO"
      format:
        type: string
        transform: upper
      priority: 5
    - keys: [series_id]
      label: "SERIES"
      format:
        type: string
      priority: 6
    - keys: [movement_dir]
      label: "MOVEMENT DIR"
      format:
        type: integer
        suffix: "\u00B0"
      priority: 7
    - keys: [movement_spd]
      label: "MOVEMENT SPD"
      format:
        type: integer
        suffix: " kt"
      priority: 8

# --- History ---
history:
  max_lookback: "720h"      # 30 days
  max_range_span: "48h"     # 2 days per query window
