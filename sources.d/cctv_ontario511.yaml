# sources.d/cctv_ontario511.yaml
# Ontario 511 — Ministry of Transportation of Ontario traffic cameras
# Source: https://511on.ca/api/v2/get/cameras?format=json&lang=en
# Auth: None required (public open data)
#
# Catalog only: JPEGs load in the browser from 511on.ca.
#
# A camera can expose several views. This release shows the first enabled one;
# the rest are reachable on the provider's own site. Showing every view needs a
# record-expansion capability the engine does not have yet, and silently
# picking one without saying so would misrepresent the camera.
schema_version: 2

name: cctv_ontario511
labels:
  category: infrastructure
  priority: low

# --- Identity ---
source_type: cctv_ontario511
layer_type: cctv
display_name: "Ontario 511 Cameras"
layer_display_name: "Traffic Cameras"

filtering: viewport

# --- Ingestion ---
transport:
  type: http_poll
  url: "https://511on.ca/api/v2/get/cameras?format=json&lang=en"
  method: GET
  headers:
    Accept: "application/json"
    User-Agent: "respondent-community/1.0 (+https://github.com/Alevsk/respondent)"
  timeout: "30s"
  interval: "3600s"
  max_response_bytes: 8388608
  rate_limit:
    requests_per_second: 1
    burst: 2
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "2s"
    max_delay: "30s"

# --- Response Parsing ---
parser:
  format: json
  max_records: 3000

# --- Record Filtering (CEL) ---
filter: >
  has(record.Id) && has(record.Latitude) && has(record.Longitude)
  && record.Latitude != null && record.Longitude != null
  && has(record.Views) && size(record.Views) > 0
  && record.Views.exists(v, has(v.Status) && string(v.Status) == "Enabled"
       && has(v.Url) && string(v.Url).startsWith("https://511on.ca/"))

# --- Entity Mapping (CEL) ---
entity:
  external_id: '"on511_" + string(record.Id)'
  name: >
    has(record.Location) && string(record.Location) != ""
      ? string(record.Location)
      : "Ontario 511 Camera " + string(record.Id)
  metadata:
    snapshot_url: 'record.Views.filter(v, has(v.Status) && string(v.Status) == "Enabled" && has(v.Url) && string(v.Url).startsWith("https://511on.ca/"))[0].Url'
    attribution: '"Ontario 511 — Ministry of Transportation of Ontario"'
    location_name: 'has(record.Location) ? string(record.Location) : ""'
    road: 'has(record.Roadway) ? string(record.Roadway) : ""'
    direction: 'has(record.Direction) ? string(record.Direction) : ""'
    camera_label: 'record.Views.filter(v, has(v.Status) && string(v.Status) == "Enabled")[0].Description'
    camera_status: '"ENABLED"' 

# --- Observation Mapping (CEL) ---
observation:
  latitude: 'double(record.Latitude)'
  longitude: 'double(record.Longitude)'
  altitude: '"0.0"'
  timestamp: 'now()'
  metadata: {}
  content_hash: >
    string(record.Id) + "|"
    + record.Views.filter(v, has(v.Status) && string(v.Status) == "Enabled" && has(v.Url) && string(v.Url).startsWith("https://511on.ca/"))[0].Url + "|"
    + (has(record.Location) ? string(record.Location) : "") + "|"
    + string(record.Latitude) + "," + string(record.Longitude)

# --- Recording ---
recording:
  mode: dedupe

# --- Cache ---
cache:
  ttl: "86400s"

# --- Display ---
display:
  icon:
    shape: camera
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#7c4dff"
    width: 1.0
    opacity: 0.4
  style:
    color: "#7c4dff"
    point_size: 6
  media:
    - id: camera
      kind: snapshot
      label: "Camera feed"
      url_key: snapshot_url
      attribution_key: attribution
      allowed_origins:
        - "https://511on.ca"
      snapshot:
        refresh_interval: "30s"
        cache_bust_param: "_respondent_frame"
  # Every source feeding the cctv layer declares this same renderer set, listing
  # each provider's key variants. A renderer only appears when the entity
  # carries one of its keys, so each camera shows its own provider's fields.
  field_renderers:
    - keys: [location_name, camera_location]
      label: "LOCATION"
      format:
        type: string
      priority: 0
    - keys: [road]
      label: "ROAD"
      format:
        type: string
        transform: upper
      priority: 1
    - keys: [direction]
      label: "DIRECTION"
      format:
        type: string
        transform: upper
      priority: 2
    - keys: [area, signal_eng_area, address_quadrant]
      label: "AREA"
      format:
        type: string
        transform: upper
      priority: 3
    - keys: [landmark]
      label: "LANDMARK"
      format:
        type: string
      priority: 4
    - keys: [camera_status]
      label: "STATUS"
      format:
        type: string
        transform: upper
      priority: 5
    - keys: [camera_label]
      label: "CAMERA"
      format:
        type: string
      priority: 6
    - keys: [council_district]
      label: "COUNCIL DISTRICT"
      format:
        type: string
      priority: 7
    - keys: [camera_mfg]
      label: "MANUFACTURER"
      format:
        type: string
      priority: 8
