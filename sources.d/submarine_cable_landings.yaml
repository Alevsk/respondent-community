# sources.d/submarine_cable_landings.yaml
# TeleGeography Submarine Cable Landing Points
# Source: https://www.submarinecablemap.com/
# Auth: None (public GeoJSON API)
# Format: GeoJSON FeatureCollection with Point features
#
# Static infrastructure overlay showing global submarine cable landing points.
# Each feature contains a landing point name, slug ID, and coordinates.
schema_version: 1

name: submarine_cable_landings
labels:
  category: infrastructure
  priority: low
source_type: submarine_cable_landings
layer_type: subsea_cables
display_name: "Submarine Cable Landing Points"

enabled: true

transport:
  type: http_poll
  url: "https://www.submarinecablemap.com/api/v3/landing-point/landing-point-geo.json"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "15s"
  interval: "604800s" # 7 days — multi-year static infrastructure
  max_response_bytes: 10485760  # 10MB
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: "2s"
    max_delay: "30s"

parser:
  format: geojson
  records_path: "features"
  max_records: 10000

# Filter: require valid geometry and a non-empty id
filter: >
  has(record.properties) && has(record.properties.id)
  && record.properties.id != ""
  && has(record.geometry) && has(record.geometry.coordinates)

entity:
  external_id: >
    "cable_lp_" + record.properties.id
  name: >
    has(record.properties.name) && record.properties.name != ""
      ? record.properties.name
      : record.properties.id
  metadata:
    landing_point_id: >
      record.properties.id
    name: >
      has(record.properties.name) ? record.properties.name : ""
    is_tbd: >
      has(record.properties.is_tbd) ? string(record.properties.is_tbd) : "false"

observation:
  latitude: >
    record.geometry.coordinates[1]
  longitude: >
    record.geometry.coordinates[0]
  altitude: "0.0"
  timestamp: >
    now()
  velocity: {}
  metadata:
    name: >
      has(record.properties.name) ? record.properties.name : ""
  content_hash: >
    record.properties.id

recording:
  mode: dedupe

cache:
  ttl: "86400s"

display:
  icon:
    shape: anchor
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#00bfff"
    width: 1.5
    opacity: 0.7
  style:
    color: "#00bfff"
    point_size: 6
  field_renderers:
    - keys: [name]
      label: "LANDING POINT"
      format:
        type: string
      priority: 0
    - keys: [landing_point_id]
      label: "ID"
      format:
        type: string
      priority: 1
    - keys: [is_tbd]
      label: "STATUS"
      format:
        type: string
        transform: upper
      priority: 2
