transport:
  type: http_poll
  url: "https://bwt.cbp.gov/api/waittimes"
  method: GET
  headers:
    Accept: "application/json"
  timeout: "15s"
  interval: "900s"  # 15 minutes — wait times drift gradually
  max_response_bytes: 1048576

parser:
  format: json
  max_records: 200

# Only process ports we have coordinates for
filter: 'has_lookup("ports", string(record.port_number))'

entity:
  external_id: 'string(record.port_number)'
  name: 'lookup("ports", string(record.port_number), "name")'
  metadata:
    border: 'has(record.border) ? record.border : ""'
    crossing_name: 'has(record.crossing_name) ? record.crossing_name : ""'
    hours: 'has(record.hours) ? record.hours : ""'

observation:
  latitude: 'lookup("ports", string(record.port_number), "lat")'
  longitude: 'lookup("ports", string(record.port_number), "lon")'
  altitude: "0.0"
  timestamp: 'now()'
  metadata:
    passenger_delay: >
      has(record.passenger_vehicle_lanes) && has(record.passenger_vehicle_lanes.standard_lanes) ?
      string(record.passenger_vehicle_lanes.standard_lanes.delay_minutes) : ""
    commercial_delay: >
      has(record.commercial_vehicle_lanes) && has(record.commercial_vehicle_lanes.standard_lanes) ?
      string(record.commercial_vehicle_lanes.standard_lanes.delay_minutes) : ""
    pedestrian_delay: >
      has(record.pedestrian_lanes) && has(record.pedestrian_lanes.standard_lanes) ?
      string(record.pedestrian_lanes.standard_lanes.delay_minutes) : ""
  content_hash: >
    string(record.port_number) + "_" + (has(record.passenger_vehicle_lanes) && has(record.passenger_vehicle_lanes.standard_lanes) ? string(record.passenger_vehicle_lanes.standard_lanes.delay_minutes) : "") + "_" + (has(record.commercial_vehicle_lanes) && has(record.commercial_vehicle_lanes.standard_lanes) ? string(record.commercial_vehicle_lanes.standard_lanes.delay_minutes) : "") + "_" + (has(record.pedestrian_lanes) && has(record.pedestrian_lanes.standard_lanes) ? string(record.pedestrian_lanes.standard_lanes.delay_minutes) : "")

recording:
  mode: dedupe

cache:
  ttl: "600s"

display:
  icon:
    shape: shield
    rotatable: false
    interpolation: false
    scale: 1.0
  trail:
    color: "#ff9500"
    width: 1.5
    opacity: 0.7
  style:
    color: "#ff9500"
    point_size: 6
  field_renderers:
    - keys: [passenger_delay]
      label: "PASSENGER WAIT"
      format:
        type: string
        suffix: " min"
      priority: 0
    - keys: [commercial_delay]
      label: "COMMERCIAL WAIT"
      format:
        type: string
        suffix: " min"
      priority: 1
    - keys: [pedestrian_delay]
      label: "PEDESTRIAN WAIT"
      format:
        type: string
        suffix: " min"
      priority: 2
    - keys: [hours]
      label: "STATUS"
      format:
        type: string
        transform: upper
      priority: 3
