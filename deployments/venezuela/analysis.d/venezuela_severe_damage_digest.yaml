# =============================================================================
# SEVERE DAMAGE DIGEST — Venezuela earthquake
# =============================================================================
# Surfaces the most-corroborated SEVERE / TOTAL building collapses reported in
# the last 72h (ranked by confirmation count) so responders get a concise,
# de-duplicated situational picture instead of scrolling thousands of points.
# Single-layer (venezuela_building_damage) — no cross-join, cheap to run.
#
# TS NOTE: emits a FRESH ts so the post-SQL lookback gate keeps the rows; the
# real report time is implicit in the 72h window.
# =============================================================================
schema_version: 1
name: venezuela_severe_damage_digest
display_name: "VE Severe Damage Digest"
enabled: true

schedule:
  interval: "1800s"   # 30 min

data:
  layers: [venezuela_building_damage]
  lookback: "72h"
  min_records: 1
  max_records: 30
  dedup:
    window: "12h"
    key_fields: ["entity_external_id"]
  sql: |
    WITH latest AS (
      SELECT s.id AS entity_id, s.external_id, s.name, s.metadata,
        o.lat, o.lon, o.ts,
        json_extract(s.metadata,'$.damage_type')   AS damage_type,
        json_extract(s.metadata,'$.place')         AS place,
        json_extract(s.metadata,'$.needs')         AS needs,
        CAST(COALESCE(json_extract(s.metadata,'$.confirmations'),'0') AS INTEGER) AS confirmations,
        ROW_NUMBER() OVER (PARTITION BY s.id ORDER BY o.ts DESC) AS rn
      FROM entities s
      JOIN observations o ON o.entity_id = s.id
      WHERE s.layer_type = 'venezuela_building_damage'
        AND o.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-72 hours')
    )
    SELECT
      entity_id,
      external_id,
      name,
      'venezuela_building_damage' AS layer_type,
      lat,
      lon,
      0.0 AS altitude_m,
      strftime('%Y-%m-%dT%H:%M:%SZ','now') AS ts,
      damage_type,
      place,
      needs,
      CAST(confirmations AS TEXT) AS confirmations
    FROM latest
    WHERE rn = 1
      AND damage_type IN ('total','severo')
    ORDER BY confirmations DESC, damage_type ASC
    LIMIT 30

ai:
  enabled: true
  operations:
    - name: severe_damage_triage
      tags: [venezuela, earthquake, damage, triage]
      prompt: |
        You are a disaster-response analyst for the 2026 Venezuela earthquake.
        Below are the most-corroborated severe/total building collapses reported
        in the last 72 hours.

        {{.RecordCount}} severe damage sites:
        {{range .Records}}
        - {{.EntityName}} ({{index .Metadata "place"}}) — {{index .Metadata "damage_type"}},
          {{index .Metadata "confirmations"}} confirmations | {{.Lat}}, {{.Lon}}
          Notes: {{index .Metadata "needs"}}
        {{end}}

        Produce a triage assessment per site (search-and-rescue / structural
        hazard priority).

        attention — set DIRECTLY (do NOT auto-elevate):
          routine -> info (OMIT), notable -> medium, significant -> high, critical -> critical.

        USEFULNESS RULES:
        - OMIT low-confidence or partial cases. Return FEWER items. An EMPTY
          assessments array is correct when nothing is urgent.
        - Reserve high/critical for total collapses with multiple confirmations.

        Respond with JSON matching this schema:
        {{.OutputSchema}}
      output_schema:
        type: object
        required: [assessments, summary]
        properties:
          summary:
            type: string
          assessments:
            type: array
            items:
              type: object
              required: [entity_external_id, place, priority, attention, assessment]
              properties:
                entity_external_id: { type: string }
                place: { type: string }
                priority:
                  type: string
                  enum: [routine, notable, significant, critical]
                attention:
                  type: string
                  enum: [info, low, medium, high, critical]
                assessment: { type: string }
      max_tokens: 12000
      temperature: 0.1
      output:
        store_insights: true
        min_attention: "medium"
        insight_type: "venezuela_severe_damage"
        results_path: "assessments"
        ref_fields:
          - field: "entity_external_id"
            layer_type: "venezuela_building_damage"
        websocket_push: true
        retention: "336h"
