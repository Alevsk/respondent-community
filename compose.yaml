services:
  respondent:
    image: "docker.io/alevsk/respondent-community:latest"
    command: ["serve", "--config", "/etc/respondent/respondent.yaml"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${CADDY_HTTP_PORT:-8090}:8090"
    volumes:
      - ./respondent.yaml:/etc/respondent/respondent.yaml:ro
      - ./sources.d:/sources.d:ro
      - ./analysis.d:/analysis.d:ro
      - ./data:/data
