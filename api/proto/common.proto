syntax = "proto3";

package respondent.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/Alevsk/respondent/gen/go/respondent/v1;respondentv1";

// Document-level metadata for the merged OpenAPI v2 artifact consumed by the
// frontend REST client. Without it the merged document inherits the first
// proto file's name as its title.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Respondent API";
    version: "1.0.0";
  }
  host: "localhost:8090";
  base_path: "/";
  schemes: HTTP;
  schemes: HTTPS;
};

// Common messages and types shared across services

message GeoPoint {
  double lat = 1;
  double lon = 2;
  double alt_m = 3;
}

message Camera {
  GeoPoint position = 1;
  double heading = 2;
  double pitch = 3;
  double roll = 4;
  double range = 5;
}

// AttentionLevel indicates the severity or importance of an AI insight.
enum AttentionLevel {
  ATTENTION_LEVEL_UNSPECIFIED = 0;
  ATTENTION_LEVEL_INFO = 1;
  ATTENTION_LEVEL_LOW = 2;
  ATTENTION_LEVEL_MEDIUM = 3;
  ATTENTION_LEVEL_HIGH = 4;
  ATTENTION_LEVEL_CRITICAL = 5;
}
