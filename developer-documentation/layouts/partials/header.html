<header class="header">
  <a class="header-logo" href="/">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="6" fill="currentColor" opacity="0.1"/>
      <circle cx="16" cy="16" r="10" fill="none" stroke="#00ff9d" stroke-width="1.5" opacity="0.4"/>
      <circle cx="16" cy="16" r="6" fill="none" stroke="#00ff9d" stroke-width="1.5" opacity="0.7"/>
      <circle cx="16" cy="16" r="2" fill="#00ff9d"/>
      <line x1="16" y1="4" x2="16" y2="12" stroke="#00ff9d" stroke-width="1.5" opacity="0.5"/>
      <line x1="16" y1="20" x2="16" y2="28" stroke="#00ff9d" stroke-width="1.5" opacity="0.5"/>
      <line x1="4" y1="16" x2="12" y2="16" stroke="#00ff9d" stroke-width="1.5" opacity="0.5"/>
      <line x1="20" y1="16" x2="28" y2="16" stroke="#00ff9d" stroke-width="1.5" opacity="0.5"/>
    </svg>
    {{ .Site.Params.brand_name }}<span>Docs</span>
  </a>

  <nav>
    <ul class="header-nav">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>

  <div class="header-actions">
    <div class="header-search">
      <svg class="header-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search docs..." autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>

    <button class="theme-toggle" aria-label="Toggle theme">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <a class="github-link" href="{{ .Site.Params.github_docs }}" target="_blank" rel="noopener" aria-label="GitHub">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
    </a>
  </div>
</header>
