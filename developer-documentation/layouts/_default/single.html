{{ define "main" }}
{{- partial "breadcrumbs.html" . -}}
<article>
  <div class="page-title-row">
    <h1>{{ .Title }}</h1>
    <button class="llm-copy-btn" aria-label="Copy page as Markdown for LLM" title="Copy as Markdown (LLM-friendly)">
      <svg class="llm-copy-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      <svg class="llm-check-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span class="llm-copy-label">LLM</span>
    </button>
  </div>
  <textarea class="llm-markdown-source" hidden>{{ .RawContent }}</textarea>
  {{ if .Params.description }}
  <p class="content-description" style="font-size: var(--text-lg); color: var(--color-text-secondary); margin-bottom: 2rem;">{{ .Params.description }}</p>
  {{ end }}
  {{ .Content }}
</article>
<a class="edit-link" href="{{ .Site.Params.github_docs }}/edit/main/apps/developer-documentation/content/{{ .File.Path }}" target="_blank" rel="noopener">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  Edit this page on GitHub
</a>
{{ end }}
