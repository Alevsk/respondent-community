# Respondent — Example Configuration
# Copy and modify for your deployment.

database:
  path: "/data/respondent.db"          # SQLite file path (created if missing; overridden by RESPONDENT_DATABASE_PATH env var in compose.yaml)

  # Size-cap retention (ON by default — set max_size: "" to disable).
  # The observations table is append-only and grows without bound. When the
  # on-disk size exceeds max_size, the oldest observations are pruned in batches
  # down to max_size * low_water_ratio and the freed space is returned to the OS.
  # Live ingestion is never throttled — the cap is chased by pruning.
  retention:
    max_size: "5GB"                   # cap on-disk size; "" disables. e.g. "50GB" / "500MB".
    low_water_ratio: 0.90             # prune down to max_size * this fraction (hysteresis)
    check_interval: "10m"             # how often size is measured and pruning runs
    batch_size: 5000                  # observation rows deleted per transaction
    max_batches_per_tick: 200         # per-tick prune budget (~1M rows); next tick continues
    incremental_vacuum_pages: 10000   # pages reclaimed to the OS per tick (~40MB at 4KB pages)

server:
  port: 8090                       # Single port for API + WebSocket + Earth UI

ingest:
  sources_dir: "./sources.d"       # Path to source definition YAML files

ai:
  enabled: false                  # Set to true + configure llm section to enable AI features
  analysis_dir: "./analysis.d"  # SQLite-compatible analysis definitions
  workers:
    enrichment: 2                  # Concurrent enrichment workers
    analysis: 1                    # Concurrent analysis workers

llm:
  provider: "zai"

  zai:
    model: "glm-4.7"
    max_tokens: 2048
    base_url: "https://api.z.ai/api/paas/v4"
    # api_key: set via RESPONDENT_LLM_ZAI_API_KEY env var

# Geocoder configuration for AI geo-enrichment coordinate resolution.
# Tier 2: Nominatim geocoding API. Tier 3: Country centroid fallback.
geocoder:
  provider: "nominatim"
  nominatim:
    base_url: "https://nominatim.openstreetmap.org"
    user_agent: "respondent/1.0 (geospatial-intelligence)"
  rate_limit:
    requests_per_second: 1.0
    burst: 5
  cache:
    enabled: true
    ttl: "168h"
    key_prefix: "geocoder:"
  country_centroids:
    - { iso3: "AFG", lat: 33.94, lon: 67.71 }
