# =============================================================================
# FLIGHT ANOMALY DETECTION — DISABLED (Needs Redesign)
# =============================================================================
#
# STATUS: DISABLED — Kept as reference for future redesign.
#
# PROBLEM:
#   The current implementation is fundamentally flawed. It fetches ONE observation
#   per entity (the latest snapshot) and asks the LLM to detect anomalies like
#   "heading changes" and "stationary at altitude" — which require TIME-SERIES
#   data (multiple observations over time). You cannot detect trajectory anomalies
#   from a single data point. The LLM is effectively guessing/hallucinating.
#
# WHAT WE WANT THIS TO BE:
#   A meaningful flight anomaly detector that identifies:
#   1. Unusual holding patterns (circling at altitude for extended periods)
#   2. Sudden altitude changes (rapid descent/climb outside normal profiles)
#   3. Route deviations (aircraft far from typical routes for their type)
#   4. Emergency squawk codes (7500=hijack, 7600=comms, 7700=emergency)
#   5. Military aircraft in civilian corridors or unusual airspace
#   6. Flights operating at unusual hours for their route
#
# WHAT NEEDS TO CHANGE:
#   - Switch to SQL data path to fetch MULTIPLE observations per entity
#     (e.g., last 10 observations per aircraft within lookback window)
#   - Use SQL window functions to compute deltas:
#       LAG(altitude_m) OVER (PARTITION BY entity_id ORDER BY ts) for altitude changes
#       LAG(position)   OVER (...) for heading/distance changes between observations
#       COUNT(*) OVER (PARTITION BY entity_id) for observation frequency
#   - Pre-filter in SQL to only send genuinely suspicious patterns to the LLM:
#       WHERE altitude_delta > 3000 (rapid altitude change in one interval)
#       OR distance_delta < 5km AND observation_count > 5 (holding pattern)
#       OR entity.metadata->>'squawk' IN ('7500', '7600', '7700')
#   - Combine flights_commercial AND flights_military in the SQL
#   - The LLM should CONFIRM and CLASSIFY pre-filtered anomalies, not discover them
#
# DATA REQUIREMENTS:
#   - observations table must have multiple rows per entity (it does — the feeder
#     creates new observations on each poll cycle)
#   - Need at least 3-5 observations per entity to detect patterns
#   - SQL should use a shorter lookback (30m-1h) with high observation density
#
# EXAMPLE SQL APPROACH:
#   WITH flight_tracks AS (
#     SELECT entity_id, ts, lat, lon, altitude_m,
#            LAG(altitude_m) OVER w AS prev_alt,
#            LAG(position) OVER w AS prev_pos,
#            COUNT(*) OVER (PARTITION BY entity_id) AS obs_count
#     FROM observations
#     WHERE entity_id IN (SELECT id FROM entities WHERE layer_type IN ('flights_commercial', 'flights_military'))
#       AND ts > NOW() - INTERVAL '1 hour'
#     WINDOW w AS (PARTITION BY entity_id ORDER BY ts)
#   ),
#   anomaly_candidates AS (
#     SELECT *, ABS(altitude_m - prev_alt) AS alt_delta,
#            ST_Distance(position::geography, prev_pos::geography) AS dist_delta
#     FROM flight_tracks
#     WHERE prev_alt IS NOT NULL
#   )
#   SELECT ... FROM anomaly_candidates
#   WHERE alt_delta > 3000 OR (dist_delta < 5000 AND obs_count > 5) ...
#
# =============================================================================

schema_version: 1
name: flight_anomaly_detection
display_name: "Flight Anomaly Detection"
enabled: false

schedule:
  interval: "60s"

data:
  layers:
    - flights_commercial
  lookback: "2h"
  min_records: 10
  max_records: 50
  filter: |
    has(entity.metadata.callsign) && double(observation.altitude) > 0.0

ai:
  enabled: true
  operations:
    - name: flight_anomaly_scan
      tags: [anomaly, flights, safety]
      prompt: |
        You are analyzing {{.RecordCount}} flight observations from the last {{.Lookback}}.

        Data:
        {{range .Records}}
        - {{.EntityName}} ({{.ExternalID}}): alt={{.Altitude}}m, pos={{.Lat}},{{.Lon}}
          time={{.Timestamp}}
        {{end}}

        Identify anomalies. Consider:
        1. Unusual altitudes for commercial flights (< 1000m or > 14000m)
        2. Sudden heading changes (> 90 degrees between consecutive observations)
        3. Emergency squawk codes (7500=hijack, 7600=comm failure, 7700=emergency)
        4. Stationary aircraft at altitude (speed < 50kts above 3000m)
        5. Aircraft in restricted airspace

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      output_schema:
        type: object
        required: [anomalies]
        properties:
          anomalies:
            type: array
            items:
              type: object
              required: [entity_external_id, anomaly_type, severity, title, description]
              properties:
                entity_external_id: { type: string }
                anomaly_type:
                  type: string
                  enum: [altitude, heading_change, emergency_squawk, stationary_at_altitude, restricted_airspace]
                severity: { type: integer, minimum: 0, maximum: 4 }
                title: { type: string }
                description: { type: string }
                related_entities:
                  type: array
                  items: { type: string }
      max_tokens: 2000
      temperature: 0.1
      output:
        store_insights: true
        insight_type: "flight_anomaly"
        results_path: "anomalies"
        websocket_push: true
        retention: "168h"
