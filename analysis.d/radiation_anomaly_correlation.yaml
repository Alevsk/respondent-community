# =============================================================================
# RADIATION ANOMALY CORRELATION — Multi-Hazard Nuclear Threat Detection
# =============================================================================
# Correlates radiation sensor readings with NEARBY earthquakes and conflict
# zones to detect potential nuclear incidents. Elevated radiation near an
# earthquake could indicate damage to a nuclear facility; near a conflict zone
# could indicate use of depleted uranium or a dirty bomb.
#
# Volcanoes are included only as CONTEXT, never as a primary threat trigger:
# radon/thoron from geological activity dissipates within a few km, so a high
# CPM reading whose ONLY nearby hazard is a volcano is treated as benign
# (natural geothermal background) and gated out at info/low.
#
# Noise this definition is hardened against:
#   - Far-field volcano "correlations" (radon does not travel hundreds of km;
#     radii are now tight per hazard type — see SQL).
#   - Natural onsen / hot-spring / granite background radiation.
#   - Hobbyist Safecast sensor miscalibration.
#   - Per-(sensor,hazard) duplicate rows (deduped to one assessment per sensor).
#
# Data layers: radiation (Safecast) + radiation_us (EPA RadNet) ×
#              earthquakes ∪ conflict_events ∪ volcanoes (volcano = context only)
#
# FUTURE WORK: a trailing-median per-sensor baseline (flag a reading only when it
# rises N-sigma above that sensor's own recent history) would catch true
# anomalies while suppressing site-specific background far better than a global
# CPM scale. Deliberately NOT attempted here — it is too complex/risky to do
# correctly inside this single declarative SQL without a baseline table, and a
# naive version would be worse than the current static thresholds.
# =============================================================================

schema_version: 1
name: radiation_anomaly_correlation
display_name: "Radiation Anomaly Correlation"
enabled: true

schedule:
  interval: "300s"

data:
  layers: [radiation, radiation_us]
  lookback: "24h"
  min_records: 1
  max_records: 30
  dedup:
    window: "6h"
    # One consolidated assessment per sensor. The LLM merges all of a sensor's
    # nearby hazards into a single verdict, so the dedup key is the sensor alone
    # (hazard_external_id intentionally dropped from the key).
    key_fields: ["entity_external_id"]
  sql: |
    WITH latest_rad AS (
      SELECT o.entity_id, o.lat, o.lon, o.ts,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type IN ('radiation', 'radiation_us')
        -- Anchor recency bound (the temporal-correlation fix): radiation sensors
        -- report ~hourly, so a latest reading older than 6h is stale. Without this the
        -- anchor was UNBOUNDED, letting a days-old reading seed a "current anomaly"
        -- correlation against any nearby hazard.
        AND o.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-6 hours')
    ),
    latest_eq AS (
      SELECT o.entity_id, o.lat, o.lon, o.ts,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type = 'earthquakes'
    ),
    latest_conf AS (
      SELECT o.entity_id, o.lat, o.lon,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY COALESCE(o.event_time, o.ts) DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type = 'conflict_events'
        -- Recency bound (was UNBOUNDED): keep only conflict events from the last 7d by
        -- event_time (when the conflict occurred), falling back to ts when event_time is
        -- NULL. ACLED has a ~10-day data lag, so 7d via event_time is the practical
        -- "recent conflict" window; without this a months-old event correlated with a
        -- current radiation reading.
        AND julianday(COALESCE(o.event_time, o.ts)) > julianday('now','-7 days')
    ),
    latest_vol AS (
      SELECT o.entity_id, o.lat, o.lon,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type = 'volcanoes'
    ),
    latest_nuclear AS (
      -- Latest position per nuclear facility (semi-static point features).
      SELECT o.entity_id, o.lat, o.lon,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type = 'nuclear_facilities'
    ),
    radiation_sensors AS (
      -- All radiation sensors (Safecast + EPA RadNet) with their latest reading.
      SELECT r.id, r.name, r.external_id, r.layer_type, r.metadata,
             o.lat, o.lon, o.ts,
             COALESCE(json_extract(r.metadata,'$.value_cpm'), '0') AS cpm_value,
             COALESCE(json_extract(r.metadata,'$.unit'), 'cpm') AS unit
      FROM entities r
      JOIN latest_rad o ON o.entity_id = r.id AND o.rn = 1
      WHERE r.layer_type IN ('radiation', 'radiation_us')
    ),
    nearby_earthquakes AS (
      -- Earthquakes M3.0+ within 50km of a radiation sensor (last 24h).
      -- Tight radius: only a genuinely co-located quake can plausibly explain a
      -- facility-damage radiation signature.
      SELECT
        rs.id AS sensor_id,
        rs.name AS sensor_name,
        rs.external_id AS sensor_external_id,
        rs.cpm_value,
        eq.name AS hazard_name,
        'earthquake' AS hazard_type,
        COALESCE(json_extract(eq.metadata,'$.magnitude'), '0') AS hazard_severity,
        CAST(ROUND(haversine_km(rs.lat, rs.lon, o_eq.lat, o_eq.lon)) AS TEXT) AS distance_km,
        eq.external_id AS hazard_external_id
      FROM radiation_sensors rs
      JOIN entities eq ON eq.layer_type = 'earthquakes'
      JOIN latest_eq o_eq ON o_eq.entity_id = eq.id AND o_eq.rn = 1
      WHERE o_eq.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-24 hours')
        AND CAST(COALESCE(json_extract(eq.metadata,'$.magnitude'), json_extract(eq.metadata,'$.mag'), '0') AS REAL) >= 3.0
        AND o_eq.lat BETWEEN rs.lat-(50/111.32) AND rs.lat+(50/111.32)
        AND o_eq.lon BETWEEN rs.lon-(50/(111.32*max(COS(RADIANS(rs.lat)),0.01))) AND rs.lon+(50/(111.32*max(COS(RADIANS(rs.lat)),0.01)))
        AND haversine_km(rs.lat, rs.lon, o_eq.lat, o_eq.lon) <= 50
    ),
    nearby_conflicts AS (
      -- Active conflict zones (fatalities > 0) within 50km of a radiation sensor.
      SELECT
        rs.id AS sensor_id,
        rs.name AS sensor_name,
        rs.external_id AS sensor_external_id,
        rs.cpm_value,
        conf.name AS hazard_name,
        'conflict' AS hazard_type,
        json_extract(conf.metadata,'$.fatalities') AS hazard_severity,
        CAST(ROUND(haversine_km(rs.lat, rs.lon, o_conf.lat, o_conf.lon)) AS TEXT) AS distance_km,
        conf.external_id AS hazard_external_id
      FROM radiation_sensors rs
      JOIN entities conf ON conf.layer_type = 'conflict_events'
        AND CAST(COALESCE(json_extract(conf.metadata,'$.fatalities'), '0') AS INTEGER) > 0
      JOIN latest_conf o_conf ON o_conf.entity_id = conf.id AND o_conf.rn = 1
      WHERE o_conf.lat BETWEEN rs.lat-(50/111.32) AND rs.lat+(50/111.32)
        AND o_conf.lon BETWEEN rs.lon-(50/(111.32*max(COS(RADIANS(rs.lat)),0.01))) AND rs.lon+(50/(111.32*max(COS(RADIANS(rs.lat)),0.01)))
        AND haversine_km(rs.lat, rs.lon, o_conf.lat, o_conf.lon) <= 50
    ),
    nearby_volcanoes AS (
      -- Active volcanoes within 25km of a radiation sensor — CONTEXT ONLY.
      -- Radon/thoron dissipates within a few km, so this radius is deliberately
      -- the tightest. A volcano-only correlation is benign background, never a
      -- nuclear-incident trigger (the prompt caps it at info/low).
      SELECT
        rs.id AS sensor_id,
        rs.name AS sensor_name,
        rs.external_id AS sensor_external_id,
        rs.cpm_value,
        vol.name AS hazard_name,
        'volcano' AS hazard_type,
        COALESCE(json_extract(vol.metadata,'$.status'), 'unknown') AS hazard_severity,
        CAST(ROUND(haversine_km(rs.lat, rs.lon, o_vol.lat, o_vol.lon)) AS TEXT) AS distance_km,
        vol.external_id AS hazard_external_id
      FROM radiation_sensors rs
      JOIN entities vol ON vol.layer_type = 'volcanoes'
        AND json_extract(vol.metadata,'$.status') != 'Holocene'
      JOIN latest_vol o_vol ON o_vol.entity_id = vol.id AND o_vol.rn = 1
      WHERE o_vol.lat BETWEEN rs.lat-(25/111.32) AND rs.lat+(25/111.32)
        AND o_vol.lon BETWEEN rs.lon-(25/(111.32*max(COS(RADIANS(rs.lat)),0.01))) AND rs.lon+(25/(111.32*max(COS(RADIANS(rs.lat)),0.01)))
        AND haversine_km(rs.lat, rs.lon, o_vol.lat, o_vol.lon) <= 25
    ),
    nearby_nuclear AS (
      -- PRIMARY SIGNAL: an above-background reading within 50km of a nuclear
      -- facility. A reactor / fuel-cycle site is what turns an elevated reading
      -- into a credible radiological incident (vs natural radon). Only readings
      -- above normal background (>50 CPM) qualify, so routine sensors near a
      -- distant plant do not fire.
      SELECT
        rs.id AS sensor_id,
        rs.name AS sensor_name,
        rs.external_id AS sensor_external_id,
        rs.cpm_value,
        nf.name AS hazard_name,
        'nuclear_facility' AS hazard_type,
        COALESCE(json_extract(nf.metadata,'$.country'), 'unknown') AS hazard_severity,
        CAST(ROUND(haversine_km(rs.lat, rs.lon, o_nf.lat, o_nf.lon)) AS TEXT) AS distance_km,
        nf.external_id AS hazard_external_id
      FROM radiation_sensors rs
      JOIN entities nf ON nf.layer_type = 'nuclear_facilities'
      JOIN latest_nuclear o_nf ON o_nf.entity_id = nf.id AND o_nf.rn = 1
      WHERE CAST(COALESCE(rs.cpm_value,'0') AS REAL) > 50
        AND o_nf.lat BETWEEN rs.lat-(50/111.32) AND rs.lat+(50/111.32)
        AND o_nf.lon BETWEEN rs.lon-(50/(111.32*max(COS(RADIANS(rs.lat)),0.01))) AND rs.lon+(50/(111.32*max(COS(RADIANS(rs.lat)),0.01)))
        AND haversine_km(rs.lat, rs.lon, o_nf.lat, o_nf.lon) <= 50
    )
    -- Combine all correlations (one row per sensor-hazard pair; the LLM and
    -- dedup collapse these to one assessment per sensor).
    SELECT
      ne.sensor_id AS entity_id,
      ne.sensor_name AS name,
      ne.sensor_external_id AS external_id,
      'radiation' AS layer_type,
      0.0 AS lat, 0.0 AS lon, 0.0 AS altitude_m, strftime('%Y-%m-%dT%H:%M:%SZ','now') AS ts,
      ne.cpm_value,
      ne.hazard_name,
      ne.hazard_type,
      ne.hazard_severity,
      ne.distance_km,
      ne.hazard_external_id
    FROM (
      SELECT * FROM nearby_nuclear
      UNION ALL
      SELECT * FROM nearby_earthquakes
      UNION ALL
      SELECT * FROM nearby_conflicts
      UNION ALL
      SELECT * FROM nearby_volcanoes
    ) ne
    ORDER BY CAST(COALESCE(ne.cpm_value,'0') AS REAL) DESC, CAST(COALESCE(ne.distance_km,'0') AS INTEGER) ASC
    LIMIT 30

ai:
  enabled: true
  operations:
    - name: radiation_hazard_assessment
      tags: [osint, radiation, nuclear, earthquake, conflict, volcano, cross-layer]
      prompt: |
        You are a nuclear safety and radiological threat analyst. Your assessments inform public safety decisions, so false alarms are costly — be conservative and default to NOT raising an alert unless the evidence is genuinely concerning.

        RADIATION ANOMALY CORRELATION: {{.RecordCount}} radiation sensor readings detected near
        nuclear facilities (within 50km), earthquakes/conflicts (within 50km), or volcanoes
        (within 25km) (last {{.Lookback}}).

        Correlation data:
        {{range .Records}}
        - SENSOR: {{.EntityName}} (ID: {{.ExternalID}}) | Reading: {{index .Metadata "cpm_value"}} CPM
          HAZARD: {{index .Metadata "hazard_name"}} (ref: {{index .Metadata "hazard_external_id"}}) (type: {{index .Metadata "hazard_type"}}, severity: {{index .Metadata "hazard_severity"}})
          Distance: {{index .Metadata "distance_km"}}km
        {{end}}

        Radiation reference (CPM): 0-50 normal background, 50-100 slightly elevated,
        100-200 elevated (investigate), 200+ high (concern), 1000+ emergency. NOTE:
        many regions have legitimately high natural background (granite/volcanic
        soils, high altitude, radon-prone areas) where 100-200 CPM is routine.

        CONSOLIDATION: When the same sensor appears with multiple hazards, produce exactly ONE
        assessment for that sensor that weighs ALL its nearby hazards together. Never emit
        duplicate entries for the same sensor.

        HARD RULES — what counts as a real radiological anomaly:
        - The PRIMARY credible signal is an elevated, otherwise-unexplained CPM near a
          NUCLEAR FACILITY (hazard_type nuclear_facility) — a reactor / fuel-cycle site is
          what makes an elevated reading a plausible radiological incident (leak, accident,
          or sabotage). These warrant high (clearly elevated) or critical (emergency-level).
        - An EARTHQUAKE or CONFLICT near the same sensor ESCALATES a nuclear-facility
          correlation (quake-damaged reactor; facility targeting / DU munitions). A quake or
          conflict correlation WITHOUT a nearby nuclear facility is at most medium unless the
          reading is itself extreme and unexplained.
        - A high CPM whose ONLY nearby hazard is a VOLCANO CANNOT indicate a nuclear
          incident. Volcanic/geothermal radon is natural and local. Such readings MUST be
          set to info or low and gated out — never medium/high/critical.
        - OMIT entirely (do not include in the results array) any reading that is best
          explained by: natural geographic background, volcanic/geothermal radon, a known
          hot-spring / onsen region, granite or high-altitude background, or suspected
          hobbyist sensor miscalibration. Returning fewer items is correct — do NOT emit
          benign, "no action", "negligible", or "all clear" rows.

        For each sensor you DO emit (consolidated across its hazards), assess:
        1. Is the reading genuinely anomalous, or explainable by natural background / sensor error for that area?
        2. Which nearby hazard, if any, could credibly explain an elevated reading?
           - Nuclear facility: PRIMARY indicator — an elevated reading near a reactor /
             fuel-cycle site is a plausible leak/accident/sabotage and is what makes the
             reading credible rather than natural.
           - Earthquake: possible nuclear facility damage / radon release (strongest when a
             facility is also nearby).
           - Conflict: depleted-uranium munitions, nuclear facility targeting.
           - Volcano: natural radon/thoron — context only, NOT a nuclear indicator.
        3. Risk to nearby population.
        4. Alert level: normal/watch/elevated/alert/emergency.

        Each emitted assessment MUST be 2-3 sentences explaining the reasoning chain — what
        the reading means in context, why it is or is not anomalous, and what action (if any)
        is warranted.

        ATTENTION FIELD — set it DIRECTLY from this assessment's own severity; never
        auto-elevate to be safe:
        - info / low: within normal background, volcano-only correlation, or suspected
          sensor error (these should usually be OMITTED instead — see HARD RULES).
        - medium: a modestly elevated reading near a nuclear facility, or near a
          quake/conflict, that warrants a look but is not yet alarming.
        - high: a clearly anomalous reading near a nuclear facility (or credibly correlated
          with a quake/conflict).
        - critical: an emergency-level reading near a nuclear facility, or credibly
          correlated with a quake/conflict at a facility.

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      output_schema:
        type: object
        required: [correlations, summary]
        properties:
          summary:
            type: string
          correlations:
            type: array
            items:
              type: object
              required: [entity_external_id, sensor_name, hazard_name, alert_level, assessment, confidence, is_anomalous, attention]
              properties:
                sensor_name: { type: string }
                cpm_reading: { type: number }
                hazard_name: { type: string }
                hazard_type:
                  type: string
                  enum: [earthquake, conflict, volcano]
                distance_km: { type: number }
                alert_level:
                  type: string
                  enum: [normal, watch, elevated, alert, emergency]
                attention:
                  type: string
                  enum: [info, low, medium, high, critical]
                assessment: { type: string }
                confidence:
                  type: string
                  enum: [low, moderate, high]
                is_anomalous: { type: boolean }
                entity_external_id: { type: string }
                hazard_external_id: { type: string }
      max_tokens: 12000
      temperature: 0.1
      output:
        store_insights: true
        min_attention: "high"   # noise gate: drop results below this attention
        insight_type: "radiation_anomaly"
        results_path: "correlations"
        ref_fields:
          - field: "hazard_external_id"
            layer_type: "nuclear_facilities"
          - field: "hazard_external_id"
            layer_type: "earthquakes"
          - field: "hazard_external_id"
            layer_type: "conflict_events"
          - field: "hazard_external_id"
            layer_type: "volcanoes"
        websocket_push: true
        retention: "336h"
