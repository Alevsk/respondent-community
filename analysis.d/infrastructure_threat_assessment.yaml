# =============================================================================
# CRITICAL INFRASTRUCTURE THREAT ASSESSMENT — Cross-Layer Hazard Detection
# =============================================================================
# Correlates natural hazards (earthquakes, disasters, active volcanoes, extreme
# weather) with critical internet/telecom infrastructure (subsea cables, IXPs,
# data centers) to assess physical damage risk and service disruption potential.
#
# Hazard sources:
#   - Earthquakes M3.0+ (last 12h), admitted via a MAGNITUDE-SCALED radius:
#     shallow (depth<70km) M3-4 <=30km, M4-5 <=60km, M5-6 <=120km, M6+ <=250km;
#     deep (depth>=100km) only within <=80km. M<5.0 only admitted when <30km.
#   - Disaster alerts (GDACS — tsunamis, cyclones, floods)
#   - Active volcanoes (non-Holocene status = recent/historical activity; treated
#     as negligible by the model since there is no live eruption-state source)
#   - Extreme weather alerts (NOAA — severity 'Extreme')
#
# Noise control: ~70% of legacy output was negligible far/deep quakes. The radius
# is now magnitude-scaled, a relevance floor drops weak distant quakes, the same
# physical quake arriving under EMSC vs USGS ids is collapsed via quake_key, and
# the model OMITs no_action / negligible / duplicate rows from the results array.
#
# Infrastructure targets:
#   - Submarine cable landing points (1,908 entities)
#   - Internet infrastructure — IXPs, data centers (5,264 entities)
# =============================================================================

schema_version: 1
name: infrastructure_threat_assessment
display_name: "Critical Infrastructure Threat Assessment"
enabled: true

schedule:
  interval: "180s"

data:
  layers: [earthquakes, disaster_alerts, volcanoes, weather_alerts, subsea_cables, internet_infrastructure]
  lookback: "12h"
  min_records: 1
  max_records: 30
  dedup:
    window: "3h"
    # Collapse the same physical quake arriving under EMSC vs USGS ids: a derived
    # spatiotemporal key (hazard_type + lat/lon rounded to 0.1 degree) replaces the
    # provider-specific external_id so both feeds dedup to one infra pairing.
    key_fields: ["quake_key", "infrastructure_external_id"]
  sql: |
    WITH latest_hazard AS (
      SELECT o.entity_id, o.lat, o.lon, o.altitude_m, o.ts,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type IN ('earthquakes', 'disaster_alerts', 'volcanoes', 'weather_alerts')
    ),
    latest_infra AS (
      SELECT o.entity_id, o.lat, o.lon,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type IN ('subsea_cables', 'internet_infrastructure')
    ),
    recent_hazards AS MATERIALIZED (
      -- MATERIALIZED: compute the hazard set once. Otherwise SQLite re-runs this
      -- 4-way UNION (with per-layer window lookups) once per infrastructure
      -- position in the spatial join (~7k infra entities) => the query never
      -- finishes within the timeout.
      -- Earthquakes M3.0+ in last 12h
      SELECT e.id, e.name, e.external_id, e.layer_type, e.metadata,
             o.lat, o.lon, o.altitude_m, o.ts,
             'earthquake' AS hazard_type,
             COALESCE(json_extract(e.metadata,'$.magnitude'), json_extract(e.metadata,'$.mag'), '0') AS severity_value,
             COALESCE(json_extract(e.metadata,'$.depth'), '0') AS depth_km
      FROM entities e
      JOIN latest_hazard o ON o.entity_id = e.id AND o.rn = 1
      WHERE e.layer_type = 'earthquakes'
        AND o.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-12 hours')
        AND CAST(COALESCE(json_extract(e.metadata,'$.magnitude'), json_extract(e.metadata,'$.mag'), '0') AS REAL) >= 3.0
      UNION ALL
      -- Active disaster alerts (GDACS — tsunamis, cyclones, floods, etc.)
      SELECT e.id, e.name, e.external_id, e.layer_type, e.metadata,
             o.lat, o.lon, o.altitude_m, o.ts,
             'disaster' AS hazard_type,
             COALESCE(json_extract(e.metadata,'$.alertlevel'), 'unknown') AS severity_value,
             '0' AS depth_km
      FROM entities e
      JOIN latest_hazard o ON o.entity_id = e.id AND o.rn = 1
      WHERE e.layer_type = 'disaster_alerts'
        AND o.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-12 hours')
      UNION ALL
      -- Active volcanoes (non-Holocene = has erupted in recorded history)
      SELECT e.id, e.name, e.external_id, e.layer_type, e.metadata,
             o.lat, o.lon, o.altitude_m, o.ts,
             'volcano' AS hazard_type,
             COALESCE(json_extract(e.metadata,'$.status'), 'unknown') AS severity_value,
             '0' AS depth_km
      FROM entities e
      JOIN latest_hazard o ON o.entity_id = e.id AND o.rn = 1
      WHERE e.layer_type = 'volcanoes'
        AND json_extract(e.metadata,'$.status') != 'Holocene'
      UNION ALL
      -- Extreme weather alerts (NOAA)
      SELECT e.id, e.name, e.external_id, e.layer_type, e.metadata,
             o.lat, o.lon, o.altitude_m, o.ts,
             'extreme_weather' AS hazard_type,
             COALESCE(json_extract(e.metadata,'$.severity'), 'unknown') AS severity_value,
             '0' AS depth_km
      FROM entities e
      JOIN latest_hazard o ON o.entity_id = e.id AND o.rn = 1
      WHERE e.layer_type = 'weather_alerts'
        -- Recency bound: NOAA polls every 5 min and populates no event_time/end, so a
        -- latest obs older than ~1h means the alert is no longer reported (stale). The
        -- other hazard branches (earthquakes/disasters, 12h) persist longer; weather
        -- goes stale fast, so it gets its own 1h window. Without this an old Extreme
        -- alert joined live infrastructure as a current threat.
        AND o.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-1 hours')
        AND json_extract(e.metadata,'$.severity') = 'Extreme'
    )
    SELECT
      h.id AS entity_id,
      h.name,
      h.external_id AS external_id,
      h.layer_type,
      h.lat, h.lon, h.altitude_m, h.ts,
      h.hazard_type,
      h.severity_value,
      h.depth_km,
      infra.name AS infrastructure_name,
      infra.layer_type AS infrastructure_type,
      json_extract(infra.metadata,'$.name') AS cable_name,
      json_extract(infra.metadata,'$.org_name') AS facility_org,
      json_extract(infra.metadata,'$.net_count') AS network_count,
      json_extract(infra.metadata,'$.ix_count') AS ix_count,
      infra.external_id AS infrastructure_external_id,
      -- Derived spatiotemporal key: collapses the same physical quake arriving
      -- under EMSC vs USGS external_ids (lat/lon rounded to ~0.1 deg / ~11km).
      h.hazard_type || ':' || CAST(ROUND(h.lat,1) AS TEXT) || ',' || CAST(ROUND(h.lon,1) AS TEXT) AS quake_key,
      -- Magnitude-scaled admission radius (see WHERE CASE below): shallow quakes
      -- (<70km) widen with magnitude; deep quakes (>=100km) only within 80km.
      CAST(ROUND(haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon)) AS TEXT) AS distance_km
    FROM recent_hazards h
    JOIN entities infra ON infra.layer_type IN ('subsea_cables', 'internet_infrastructure')
    JOIN latest_infra o_infra ON o_infra.entity_id = infra.id AND o_infra.rn = 1
    -- bbox prefilter using the widest radius we still admit (300km, for
    -- non-earthquake hazards) before the precise haversine CASE below. Earthquakes
    -- are capped far tighter by the magnitude-scaled CASE, so the wider bbox is a
    -- safe (over-inclusive) superset.
    WHERE o_infra.lat BETWEEN h.lat-(300/111.32) AND h.lat+(300/111.32)
      AND o_infra.lon BETWEEN h.lon-(300/(111.32*max(COS(RADIANS(h.lat)),0.01))) AND h.lon+(300/(111.32*max(COS(RADIANS(h.lat)),0.01)))
      AND CASE
        -- RELEVANCE FLOOR (applies to all earthquakes first): only admit M<5.0
        -- when the infra is within 30km. This drops the weak distant quakes that
        -- previously flooded the output as "negligible (<1%)".
        WHEN h.hazard_type = 'earthquake' AND CAST(h.severity_value AS REAL) < 5.0
          THEN haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon) <= 30
        -- Shallow M5+ (<70km depth): magnitude-scaled radius. Shallow events
        -- damage the surface, so the admitted radius widens with magnitude.
        --   M5-6 <= 120km, M6+ <= 250km.
        WHEN h.hazard_type = 'earthquake' AND CAST(h.depth_km AS REAL) < 70 THEN
          CASE
            WHEN CAST(h.severity_value AS REAL) >= 6.0
              THEN haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon) <= 250
            ELSE haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon) <= 120
          END
        -- Deep M5+ (>=100km depth): energy is attenuated by depth, so admit only
        -- very close infra (<=80km). Intermediate-depth (70-100km) quakes fall
        -- through to the final WHEN and are excluded entirely.
        WHEN h.hazard_type = 'earthquake' AND CAST(h.depth_km AS REAL) >= 100
          THEN haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon) <= 80
        WHEN h.hazard_type = 'earthquake' THEN 0
        -- Non-earthquake hazards (disaster, volcano, extreme weather): 300km.
        ELSE haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon) <= 300
      END
    ORDER BY
      CASE WHEN h.hazard_type = 'earthquake' THEN CAST(h.severity_value AS REAL) ELSE 0 END DESC,
      haversine_km(h.lat, h.lon, o_infra.lat, o_infra.lon) ASC
    LIMIT 30

ai:
  enabled: true
  operations:
    - name: infrastructure_risk_analysis
      tags: [osint, infrastructure, earthquake, disaster, volcano, weather, cables, internet, cross-layer]
      prompt: |
        You are a critical infrastructure protection analyst assessing physical threats to internet and telecommunications infrastructure from natural hazards.

        CRITICAL INFRASTRUCTURE THREAT ANALYSIS: {{.RecordCount}} hazards detected
        near critical internet/telecom infrastructure (last {{.Lookback}}).

        Hazard types: earthquake, disaster (GDACS), volcano, extreme_weather (NOAA).

        DAMAGE RADIUS THRESHOLDS BY HAZARD TYPE:
        - Earthquake M3-4: <20km direct damage, <50km ground motion effects
        - Earthquake M4-5: <50km direct damage, <100km significant shaking
        - Earthquake M5-6: <100km direct damage, <200km moderate shaking (cable landing stations at risk)
        - Earthquake M6+: <200km catastrophic potential, <500km infrastructure stress
        - Shallow earthquakes (<70km depth) cause 3-10x more surface damage than deep events
        - Submarine cables are most vulnerable at shore landing points and in continental shelf zones
        - Tsunami from M7+ offshore earthquake: cables at risk within 1000km of coastline
        - Volcano: lahars/pyroclastic flows within 30km, ashfall infrastructure damage within 100km
        - Extreme weather: direct infrastructure damage within 50km of severe event center

        Hazard-to-infrastructure proximity data:
        {{range .Records}}
        - HAZARD: {{.EntityName}} ({{index .Metadata "hazard_type"}}, severity: {{index .Metadata "severity_value"}}, ID: {{.ExternalID}}, layer: {{.LayerType}})
          {{if index .Metadata "depth_km"}}Depth: {{index .Metadata "depth_km"}}km | {{end}}Position: {{.Lat}}, {{.Lon}}
          THREATENED: {{index .Metadata "infrastructure_name"}} ({{index .Metadata "infrastructure_type"}}, ref: {{index .Metadata "infrastructure_external_id"}})
          {{if index .Metadata "cable_name"}}Cable: {{index .Metadata "cable_name"}}{{end}}
          {{if index .Metadata "facility_org"}}Operator: {{index .Metadata "facility_org"}} ({{index .Metadata "network_count"}} networks, {{index .Metadata "ix_count"}} IXPs){{end}}
          Distance: {{index .Metadata "distance_km"}}km
        {{end}}

        Consider the infrastructure's strategic importance. A cable landing point serving as the sole international internet connection for an island nation is FAR more critical than one of dozens of cables landing at a major hub like Singapore or New York.

        VOLCANO HANDLING: the volcano feed has NO live eruption-state source — a
        non-Holocene status only means the volcano erupted at some point in recorded
        history, NOT that it is erupting now. Treat any volcano as NEGLIGIBLE and
        OMIT it from the results array unless a co-located disaster/weather hazard
        independently indicates active danger.

        For each hazard-infrastructure pair, assess:
        1. Physical damage probability — use the DAMAGE RADIUS THRESHOLDS above to calibrate your assessment against the actual distance and hazard magnitude
        2. Service disruption potential (how many networks/cables could be affected)
        3. Redundancy assessment (are there alternative cable routes or facilities?)
        4. Strategic importance — routine (well-connected hub with many alternatives), significant (regional importance, limited alternatives), or critical (sole or primary connection for a region/nation)
        5. Recommended action — no_action, monitor, alert_operator, or activate_contingency
        6. Overall threat level: low/moderate/elevated/high/critical
        7. disruption_assessment MUST be 2-3 sentences describing the potential service impact
        8. attention — set this DIRECTLY from your own threat_level for THIS pair
           (do NOT auto-elevate; mirror your assessment's severity):
             low -> low, moderate -> medium, elevated -> medium, high -> high,
             critical -> critical. (Use "info" only for purely informational rows
             you choose to keep.)

        OMIT NON-THREATS — this is the core usefulness requirement. Return FEWER
        items rather than emitting benign rows. DO NOT include a hazard-infrastructure
        pair in the "threats" array when ANY of the following is true:
        - recommended_action would be "no_action"
        - the physical damage probability is negligible / "no action" / "all clear"
        - threat_level is "low" with no realistic disruption pathway
        - the hazard is a non-erupting volcano (see VOLCANO HANDLING above)
        - the row is a duplicate of another pair (the SAME physical quake may arrive
          under both EMSC and USGS ids — report it ONCE; drop the duplicate)
        An empty "threats" array is a valid and expected response when nothing is
        actionable. Only emit pairs that genuinely warrant operator attention.

        ENTITY IDENTITY (required for correct association): in each threat object set
        entity_external_id to THIS pair's HAZARD ID and entity_layer_type to THIS
        pair's HAZARD layer (the "ID:" and "layer:" shown for the hazard above) —
        the earthquake/disaster/volcano/weather entity, NOT the infrastructure.
        Copy them verbatim; do not invent or swap them. This is what links the
        insight to the right entity instead of to every hazard in the batch.

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      output_schema:
        type: object
        required: [threats, summary]
        properties:
          summary:
            type: string
          threats:
            type: array
            items:
              type: object
              required: [entity_external_id, entity_layer_type, hazard_name, infrastructure_name, threat_level, attention, damage_probability, disruption_assessment, recommended_action, strategic_importance]
              properties:
                hazard_name: { type: string }
                hazard_type: { type: string }
                infrastructure_name: { type: string }
                infrastructure_type: { type: string }
                distance_km: { type: number }
                threat_level:
                  type: string
                  enum: [low, moderate, elevated, high, critical]
                attention:
                  type: string
                  # Set DIRECTLY from threat_level (never auto-elevated). Drives the
                  # min_attention noise gate below; non-threats are OMITTED upstream.
                  enum: [info, low, medium, high, critical]
                damage_probability: { type: string }
                disruption_assessment: { type: string }
                redundancy_notes: { type: string }
                recommended_action:
                  type: string
                  enum: [no_action, monitor, alert_operator, activate_contingency]
                strategic_importance:
                  type: string
                  enum: [routine, significant, critical]
                # Identity of THIS threat's hazard entity — used to associate the
                # insight with the correct entity. Must be the hazard's own id+layer
                # (one of earthquakes/disaster_alerts/volcanoes/weather_alerts), NOT
                # the infrastructure's, so the insight links to the quake/disaster,
                # not to every hazard in the batch.
                entity_external_id: { type: string }
                entity_layer_type:
                  type: string
                  enum: [earthquakes, disaster_alerts, volcanoes, weather_alerts]
                infrastructure_external_id: { type: string }
      max_tokens: 12000
      temperature: 0.1
      output:
        store_insights: true
        min_attention: "medium"   # noise gate: drop results below this attention
        insight_type: "infrastructure_threat"
        results_path: "threats"
        websocket_push: true
        retention: "336h"
        ref_fields:
          - field: "infrastructure_external_id"
            layer_type: "subsea_cables"
          - field: "infrastructure_external_id"
            layer_type: "internet_infrastructure"
