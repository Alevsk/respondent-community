# =============================================================================
# SOURCE DATA QUALITY AUDIT
# =============================================================================
# Operational monitoring: scores each data layer on completeness, freshness,
# consistency, and coverage. Useful for detecting broken sources, stale feeds,
# or schema drift.
#
# NOTE: This analysis uses the LLM to interpret statistical summaries. A fully
# deterministic approach (pure SQL) would be more efficient but would require
# a separate Go module outside the analysis.d/ framework. The hourly interval
# keeps token cost low (~24 LLM calls/day) while still catching source issues.
# =============================================================================

schema_version: 1
name: source_quality_audit
display_name: "Source Data Quality Audit"
enabled: false # TODO: enable

schedule:
  # Hourly — data quality doesn't change minute-to-minute.
  # Previously 60s, which burned tokens for near-identical results.
  interval: "3600s"

data:
  layers: []
  lookback: "24h"
  min_records: 5

ai:
  enabled: true
  operations:
    - name: layer_quality_audit
      tags: [quality, scoring, all_layers]
      prompt: |
        Audit the data quality for {{.RecordCount}} entities across {{.LayerCount}} layers
        from the last {{.Lookback}}.

        Per-layer statistics:
        {{range .LayerStats}}
        Layer: {{.LayerType}} ({{.Count}} entities)
          - Fields present: {{.FieldCoverage}}
          - Has coordinates: {{.CoordPercent}}%
          - Has altitude: {{.AltPercent}}%
          - Avg metadata fields: {{.AvgMetadataKeys}}
          - Unique external_ids: {{.UniqueExtIDs}}
          - Duplicate external_ids: {{.DuplicateExtIDs}}
        {{end}}

        Score each layer on the following dimensions (0-100 each):
        - completeness: percentage of expected fields that are populated
        - freshness: how recent the data is relative to expected update frequency
        - consistency: uniformity of field formats and value ranges
        - coverage: geographic and entity coverage breadth

        Also compute an overall score (weighted average) and flag specific issues.

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      output_schema:
        type: object
        required: [scores]
        properties:
          scores:
            type: array
            items:
              type: object
              required: [layer_type, completeness, freshness, consistency, coverage, overall]
              properties:
                layer_type: { type: string }
                completeness: { type: integer, minimum: 0, maximum: 100 }
                freshness: { type: integer, minimum: 0, maximum: 100 }
                consistency: { type: integer, minimum: 0, maximum: 100 }
                coverage: { type: integer, minimum: 0, maximum: 100 }
                overall: { type: integer, minimum: 0, maximum: 100 }
                issues:
                  type: array
                  items: { type: string }
      temperature: 0
      output:
        store_insights: true
        insight_type: "quality_score"
        results_path: "scores"
        retention: "168h"
