# =============================================================================
# NEWS INTELLIGENCE DIGEST — Regional News Clustering & Assessment
# =============================================================================
#
# PURPOSE:
#   Processes ingested news articles into a structured intelligence digest.
#   Clusters articles by geographic region and topic, rates intelligence value,
#   and produces strategic assessments per cluster.
#
# HOW IT WORKS:
#   1. DATA PHASE:
#      - Queries the news_articles layer for articles from the last 6 hours
#      - Deduplicates by entity_external_id within a 6h window
#      - Passes 5-50 articles to the AI phase
#
#   2. AI PHASE (LLM):
#      - Clusters articles by geographic region and topic
#      - Rates each cluster's intelligence value:
#          routine / notable / significant / critical
#      - Produces a strategic assessment per cluster
#      - Generates a global executive summary
#
#   3. OUTPUT PHASE:
#      - Stores one ai_insight per cluster (type: "news_digest")
#      - Pushes to WebSocket clients in real-time
#      - Insights expire after 7 days (168h)
#
# SCHEDULE:
#   Runs every 15 minutes (900s). News articles arrive at variable rates
#   depending on source poll intervals. 15 minutes balances timeliness
#   against avoiding redundant LLM calls on the same articles.
#
# DATA LAYERS CONSUMED:
#   - news_articles (RSS/Atom ingested news — reuters, reliefweb, etc.)
#
# =============================================================================

schema_version: 1
name: news_intelligence_digest
display_name: "News Intelligence Digest"
enabled: false # TODO: enable

schedule:
  interval: "900s"

data:
  lookback: "6h"
  min_records: 5
  max_records: 50
  layers: [news_articles]
  dedup:
    window: "6h"
    key_fields: ["entity_external_id"]

ai:
  enabled: true
  operations:
    - name: news_digest_clustering
      tags: [osint, news, intelligence, digest]

      prompt: |
        You are a senior intelligence analyst producing a news intelligence digest for a global situational awareness dashboard. Your assessments will be read by decision-makers who need rapid, accurate situational understanding.

        NEWS INTELLIGENCE DIGEST: {{.RecordCount}} articles from the last {{.Lookback}}.

        Articles:
        {{range .Records}}
        ARTICLE: {{.EntityName}}
          Location: ({{.Lat}}, {{.Lon}})
          Time: {{.Timestamp}}
          Country: {{index .Metadata "country"}}
          Author: {{index .Metadata "author"}}
          Description: {{index .Metadata "description"}}
          URL: {{index .Metadata "source_url"}}
        {{end}}

        TASK:
        1. Cluster these articles by geographic region AND topic (e.g., "Eastern Europe — Armed Conflict", "Southeast Asia — Natural Disaster").
        2. For each cluster, rate its intelligence value:
           - routine: Common events with no immediate strategic impact
           - notable: Events worth monitoring, may develop significance
           - significant: Events with clear strategic implications requiring attention
           - critical: Urgent events demanding immediate awareness and potential action
        3. For each cluster, write a 2-3 sentence strategic assessment explaining what is happening, why it matters, and what to watch for next.
        4. Write a 2-3 sentence executive summary covering the most important developments across all clusters.

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      output_schema:
        type: object
        required: [clusters, executive_summary]
        properties:
          executive_summary:
            type: string
          clusters:
            type: array
            items:
              type: object
              required: [region, topic, intelligence_value, article_count, strategic_assessment]
              properties:
                region: { type: string }
                topic: { type: string }
                lat: { type: number }
                lon: { type: number }
                intelligence_value:
                  type: string
                  enum: [routine, notable, significant, critical]
                article_count: { type: integer, minimum: 1 }
                headlines:
                  type: array
                  items: { type: string }
                strategic_assessment: { type: string }
                watch_items:
                  type: array
                  items: { type: string }
                entity_external_id: { type: string }

      max_tokens: 4000
      temperature: 0.2

      output:
        store_insights: true
        insight_type: "news_digest"
        results_path: "clusters"
        websocket_push: true
        retention: "168h"
