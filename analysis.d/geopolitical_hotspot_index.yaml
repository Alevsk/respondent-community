# =============================================================================
# GEOPOLITICAL HOTSPOT INDEX — Cross-Layer Composite Threat Scoring
# =============================================================================
#
# PURPOSE:
#   Fuses 4 independent data layers (conflict, military, disaster, comms) into
#   a single composite threat score (0-100) per region. This is the most
#   sophisticated analysis definition in the system — it demonstrates how to
#   use PostGIS spatial joins to correlate entities across layers that have
#   no direct relationship, only geographic proximity.
#
# HOW IT WORKS:
#   1. DATA PHASE (SQL):
#      - Anchors on conflict_events regions with fatalities > 0
#      - For each conflict region, spatially searches for:
#        a) Military aircraft within 300km (flights_military layer)
#        b) Disaster alerts within 500km (disaster_alerts layer)
#        c) Internet outages within 500km (internet_outages layer)
#      - Filters to regions with at least one corroborating signal OR >= 10 fatalities
#      - Returns up to 30 highest-fatality regions with all signal counts aggregated
#
#   2. AI PHASE (LLM):
#      - Receives the multi-signal data for each region
#      - Computes a weighted Hotspot Index (0-100) using:
#          Conflict intensity:      40% (fatalities + event count)
#          Military presence:       25% (aircraft count + type significance)
#          Disaster overlay:        20% (compounding humanitarian crisis)
#          Communications disruption: 15% (internet outages = escalation/censorship)
#      - Classifies each region: stable / elevated / volatile / crisis / critical
#      - Writes a strategic assessment explaining *why* the score is what it is
#
#   3. OUTPUT PHASE:
#      - Stores one ai_insight per region (type: "hotspot_index")
#      - Pushes each insight to connected WebSocket clients in real-time
#      - Insights expire after 14 days (336h)
#
# SCHEDULE:
#   Runs every 5 minutes (300s). This is the longest interval of any analysis
#   because the SQL query is the heaviest (4 CTEs with spatial joins across
#   4 different entity layers). 5 minutes balances freshness vs. DB load.
#
# DATA LAYERS CONSUMED:
#   - conflict_events   (ACLED armed conflict data — anchor layer)
#   - flights_military   (ADS-B military aircraft tracking)
#   - disaster_alerts    (GDACS natural disaster alerts)
#   - internet_outages   (Cloudflare Radar internet disruptions)
#
# EXAMPLE INSIGHT OUTPUT:
#   {
#     "region": "Ukraine",
#     "lat": 48.37,
#     "lon": 37.62,
#     "hotspot_index": 92,
#     "classification": "critical",
#     "conflict_score": 98,
#     "military_score": 85,
#     "disaster_score": 40,
#     "comms_score": 75,
#     "strategic_assessment": "Sustained high-intensity conflict with 125
#       fatalities across 902 events. ISR and tanker aircraft detected within
#       300km indicates active aerial operations. Internet outages corroborate
#       ongoing infrastructure targeting.",
#     "entity_external_id": "ukraine"
#   }
#
# WRITING NEW ANALYSIS DEFINITIONS — USE THIS FILE AS A TEMPLATE:
#   1. Define `data.sql` with CTEs that join across layers using PostGIS
#      ST_DWithin() for proximity matching. Each CTE should focus on one
#      signal layer and aggregate counts/types per anchor region.
#   2. Use CROSS JOIN LATERAL to get the latest observation per entity
#      (ORDER BY ts DESC LIMIT 1). This is the standard pattern.
#   3. The SELECT must include standard columns: name, layer_type, lat, lon,
#      altitude_m, ts. All other columns become .Metadata entries in the
#      prompt template (accessed via `{{index .Metadata "column_name"}}`).
#   4. Use LEFT JOINs in the final SELECT so regions with partial signal
#      coverage still appear (COALESCE nulls to 0 or 'none').
#   5. Set `max_records` to cap LLM input size. 30 is a good default for
#      complex multi-signal analyses.
#   6. In the prompt, provide clear scoring rubrics and classification
#      thresholds so the LLM produces consistent, reproducible results.
#   7. Define output_schema with required fields so responses are validated
#      before storage. Use enums for classification fields.
#   8. Set results_path to the array field in the schema — the engine will
#      store one ai_insight per array item.
#
# =============================================================================

schema_version: 1
name: geopolitical_hotspot_index
display_name: "Geopolitical Hotspot Index"
enabled: false # TODO: enable

# -----------------------------------------------------------------------------
# SCHEDULE
# -----------------------------------------------------------------------------
# interval: How often the analysis runs. Accepts Go duration strings.
#   - "300s" = every 5 minutes
#   - Alternative: use `cron: "0 */5 * * * *"` for cron-based scheduling
#     (6-field format: sec min hour dom month dow)
# Choose interval based on: SQL query cost, LLM token budget, data freshness
# needs. Heavy spatial joins like this one warrant longer intervals.
schedule:
  interval: "300s"

# -----------------------------------------------------------------------------
# DATA CONFIGURATION
# -----------------------------------------------------------------------------
# The data section controls what records are fetched before the AI phase.
#
# Two data paths exist (mutually exclusive):
#   A) Layer-based: set `layers: [layer1, layer2]` — engine queries
#      GetLatestForLayer() for each, applies CEL `filter` expressions.
#      Good for single-layer or simple multi-layer analyses.
#   B) SQL-based: set `sql: |` — engine executes raw SQL via QueryExecutor.
#      Required for cross-layer spatial joins (PostGIS). The SQL is validated
#      as read-only before execution (no INSERT/UPDATE/DELETE/DROP allowed).
#
# This definition uses path B (SQL) because it needs to spatially correlate
# entities across 4 different layers using PostGIS ST_DWithin().
data:
  # lookback: Time window for data freshness. Records with timestamps older
  # than NOW() - lookback are discarded after the SQL returns. Note: the SQL
  # itself should also filter by time (e.g., WHERE ts > NOW() - INTERVAL '24h')
  # for query performance — the engine-level lookback is a safety net.
  lookback: "24h"

  # min_records: Minimum rows required to proceed to the AI phase.
  # If the SQL returns fewer rows than this, the analysis tick is skipped
  # (logged as "insufficient records"). Set to 1 here because even a single
  # hotspot region is worth scoring.
  min_records: 1

  # max_records: Hard cap on records sent to the LLM prompt. Prevents token
  # overflow. The SQL's own LIMIT clause should match or be <= this value.
  # 30 regions is a good balance: enough for global coverage, few enough for
  # the LLM to produce detailed assessments within the token budget.
  layers: [conflict_events]
  max_records: 15
  dedup:
    window: "12h"
    key_fields: ["entity_external_id"]

  # ---------------------------------------------------------------------------
  # SQL QUERY — Cross-Layer Signal Fusion
  # ---------------------------------------------------------------------------
  # Architecture: 4 CTEs (one per signal layer) → final SELECT joins them
  #
  # CTE 1: region_signals (ANCHOR)
  #   - Source: conflict_events layer (ACLED armed conflict data)
  #   - Selects regions with fatalities > 0 as geographic anchor points
  #   - Each row = one conflict region with its lat/lon/position + stats
  #   - CROSS JOIN LATERAL gets the latest observation position per entity
  #
  # CTE 2: military_presence (SIGNAL)
  #   - Source: flights_military layer (ADS-B military aircraft)
  #   - For each anchor region, counts distinct military aircraft within 300km
  #   - 300km radius = operational range where aircraft could be supporting
  #     or monitoring the conflict zone
  #   - Aggregates aircraft type codes (K35R=tanker, R135=recon, etc.)
  #   - Time-filtered: only aircraft observed in last 24 hours
  #
  # CTE 3: nearby_disasters (SIGNAL)
  #   - Source: disaster_alerts layer (GDACS alerts)
  #   - For each anchor region, counts disaster alerts within 500km
  #   - 500km radius = disasters that could compound the humanitarian situation
  #   - Aggregates disaster types (earthquake, flood, cyclone, etc.)
  #
  # CTE 4: nearby_outages (SIGNAL)
  #   - Source: internet_outages layer (Cloudflare Radar)
  #   - For each anchor region, counts internet outages within 500km
  #   - 500km radius = outages that could indicate infrastructure targeting,
  #     government censorship, or conflict-related disruption
  #   - Aggregates outage types
  #
  # FINAL SELECT:
  #   - LEFT JOINs all signals onto anchor regions (LEFT = regions without
  #     a particular signal still appear, with COALESCE defaults)
  #   - WHERE filter requires at least one corroborating signal OR >= 10
  #     fatalities (high-fatality regions are always interesting)
  #   - ORDER BY fatalities DESC = highest-casualty regions first
  #   - LIMIT 30 = matches max_records
  #
  # PostGIS functions used:
  #   - ST_DWithin(geog1, geog2, distance_meters): true if two geographies
  #     are within the specified distance. Uses the geography type (::geography)
  #     for accurate distance on the Earth's surface (not planar).
  #   - This is indexed via GiST spatial indexes on the observations table.
  # ---------------------------------------------------------------------------
  sql: |
    WITH region_signals AS (
      -- CTE 1: ANCHOR — Conflict regions with confirmed fatalities.
      -- These are the geographic centers around which we search for
      -- corroborating signals from other layers.
      SELECT
        conf.id, conf.name AS region_name, conf.external_id,
        o_conf.lat, o_conf.lon, o_conf.position,
        CAST(COALESCE(conf.metadata->>'fatalities', '0') AS int) AS fatalities,
        CAST(COALESCE(conf.metadata->>'events', '0') AS int) AS event_count
      FROM entities conf
      CROSS JOIN LATERAL (
        -- Get the most recent observation position for this conflict entity.
        -- LATERAL allows us to reference conf.id from the outer query.
        SELECT lat, lon, position FROM observations WHERE entity_id = conf.id ORDER BY ts DESC LIMIT 1
      ) o_conf
      WHERE conf.layer_type = 'conflict_events'
        AND CAST(COALESCE(conf.metadata->>'fatalities', '0') AS int) > 0
    ),
    military_presence AS (
      -- CTE 2: SIGNAL — Military aircraft within 300km of each conflict region.
      -- 300km is roughly the operational radius for ISR orbits, tanker tracks,
      -- and AWACS coverage patterns near a conflict zone.
      SELECT
        rs.region_name,
        COUNT(DISTINCT mil.id) AS military_aircraft_count,
        STRING_AGG(DISTINCT mil.metadata->>'type', ', ') AS aircraft_types
      FROM region_signals rs
      JOIN entities mil ON mil.layer_type = 'flights_military'
      CROSS JOIN LATERAL (
        SELECT position, ts FROM observations WHERE entity_id = mil.id ORDER BY ts DESC LIMIT 1
      ) o_mil
      WHERE o_mil.ts > NOW() - INTERVAL '24 hours'
        AND ST_DWithin(rs.position::geography, o_mil.position::geography, 300000)
      GROUP BY rs.region_name
    ),
    nearby_disasters AS (
      -- CTE 3: SIGNAL — Disaster alerts within 500km of each conflict region.
      -- Disasters compound humanitarian crises in conflict zones (e.g., an
      -- earthquake during an active war creates a dual emergency).
      SELECT
        rs.region_name,
        COUNT(DISTINCT d.id) AS disaster_count,
        STRING_AGG(DISTINCT d.metadata->>'eventtype', ', ') AS disaster_types
      FROM region_signals rs
      JOIN entities d ON d.layer_type = 'disaster_alerts'
      CROSS JOIN LATERAL (
        SELECT position FROM observations WHERE entity_id = d.id ORDER BY ts DESC LIMIT 1
      ) o_d
      WHERE ST_DWithin(rs.position::geography, o_d.position::geography, 500000)
      GROUP BY rs.region_name
    ),
    nearby_outages AS (
      -- CTE 4: SIGNAL — Internet outages within 500km of each conflict region.
      -- Communications disruptions near conflict zones often indicate:
      -- infrastructure targeting, government-imposed blackouts, or ISP failures
      -- due to physical damage. A strong escalation indicator.
      SELECT
        rs.region_name,
        COUNT(DISTINCT io.id) AS outage_count,
        STRING_AGG(DISTINCT io.metadata->>'outage_type', ', ') AS outage_types
      FROM region_signals rs
      JOIN entities io ON io.layer_type = 'internet_outages'
      CROSS JOIN LATERAL (
        SELECT position FROM observations WHERE entity_id = io.id ORDER BY ts DESC LIMIT 1
      ) o_io
      WHERE ST_DWithin(rs.position::geography, o_io.position::geography, 500000)
      GROUP BY rs.region_name
    )
    -- FINAL SELECT: Merge all signals per region via LEFT JOINs.
    -- LEFT JOIN ensures regions appear even if they have no military/disaster/outage
    -- signals — COALESCE fills in zeros/defaults for missing signals.
    SELECT
      rs.id AS entity_id,
      rs.region_name AS name,
      rs.external_id AS external_id,
      'conflict_events' AS layer_type,
      rs.lat, rs.lon, 0.0 AS altitude_m,
      NOW() AS ts,
      -- All non-standard columns become .Metadata entries in the prompt template.
      -- Cast to text because AnalysisRecord.Metadata is map[string]string.
      rs.fatalities::text AS fatalities,
      rs.event_count::text AS event_count,
      COALESCE(mp.military_aircraft_count, 0)::text AS military_aircraft,
      COALESCE(mp.aircraft_types, 'none') AS aircraft_types,
      COALESCE(nd.disaster_count, 0)::text AS disaster_count,
      COALESCE(nd.disaster_types, 'none') AS disaster_types,
      COALESCE(no2.outage_count, 0)::text AS internet_outages,
      COALESCE(no2.outage_types, 'none') AS outage_types
    FROM region_signals rs
    LEFT JOIN military_presence mp ON mp.region_name = rs.region_name
    LEFT JOIN nearby_disasters nd ON nd.region_name = rs.region_name
    LEFT JOIN nearby_outages no2 ON no2.region_name = rs.region_name
    -- Inclusion filter: require at least one corroborating signal from another
    -- layer, OR high fatalities (>= 10) on their own. This prevents noise from
    -- low-casualty regions with no other signals.
    WHERE rs.fatalities > 0
      AND (COALESCE(mp.military_aircraft_count, 0) > 0
           OR COALESCE(nd.disaster_count, 0) > 0
           OR COALESCE(no2.outage_count, 0) > 0
           OR rs.fatalities >= 10)
    ORDER BY rs.fatalities DESC
    LIMIT 15

# -----------------------------------------------------------------------------
# AI CONFIGURATION
# -----------------------------------------------------------------------------
# The ai section defines the LLM operations that run on the fetched data.
# Multiple operations can be defined per analysis (they run sequentially).
ai:
  enabled: true
  operations:
    - name: hotspot_index_scoring
      # tags: Metadata labels for filtering/searching analysis definitions.
      # Used by the UI and API to categorize insights. Not used by the engine.
      tags: [osint, geopolitical, composite, cross-layer, strategic]

      # -----------------------------------------------------------------------
      # PROMPT TEMPLATE
      # -----------------------------------------------------------------------
      # Go text/template syntax. Available variables:
      #   {{.RecordCount}}  — number of records (after min/max filtering)
      #   {{.Lookback}}     — human-readable duration string (e.g., "24h0m0s")
      #   {{.Records}}      — slice of AnalysisRecord structs
      #   {{.LayerCount}}   — number of distinct layer types in records
      #   {{.LayerStats}}   — per-layer statistics (count, coverage, etc.)
      #   {{.OutputSchema}} — JSON string of the output_schema (injected by engine)
      #
      # Per-record fields (inside {{range .Records}}):
      #   {{.EntityName}}   — entity name (here: region/country name)
      #   {{.ExternalID}}   — entity external ID
      #   {{.LayerType}}    — source layer type
      #   {{.Lat}}, {{.Lon}} — geographic coordinates
      #   {{.Altitude}}     — altitude in meters
      #   {{.Timestamp}}    — RFC3339 timestamp
      #   {{index .Metadata "key"}} — any non-standard SQL column
      #
      # PROMPT DESIGN PRINCIPLES (for future analysis definitions):
      #   - Start with a clear task header identifying the analysis type
      #   - Present data in a structured, scannable format
      #   - Provide reference scales/thresholds so the LLM has calibration
      #   - Define explicit scoring weights and classification brackets
      #   - Ask for explanations (strategic_assessment) not just numbers
      #   - End with "Respond with JSON matching this schema: {{.OutputSchema}}"
      #     to trigger structured output
      # -----------------------------------------------------------------------
      prompt: |
        You are a senior geopolitical risk analyst producing composite threat assessments for a global intelligence dashboard. Your assessments will be read by decision-makers who need accurate, calibrated risk scores.

        GEOPOLITICAL HOTSPOT INDEX: Composite threat scoring for {{.RecordCount}} regions
        using cross-layer signal fusion (conflict + military + disasters + comms) over {{.Lookback}}.

        Multi-signal regional data:
        {{range .Records}}
        REGION: {{.EntityName}} ({{.Lat}}, {{.Lon}}, ID: {{.ExternalID}})
          Conflict: {{index .Metadata "fatalities"}} fatalities / {{index .Metadata "event_count"}} events
          Military: {{index .Metadata "military_aircraft"}} aircraft ({{index .Metadata "aircraft_types"}})
          Disasters: {{index .Metadata "disaster_count"}} ({{index .Metadata "disaster_types"}})
          Comms disruption: {{index .Metadata "internet_outages"}} outages ({{index .Metadata "outage_types"}})
        {{end}}

        For each region, compute a composite Hotspot Index (0-100) using these weighted signals:
        - Conflict intensity (fatalities + events): 40% weight
        - Military presence (aircraft count + types — ISR/AWACS higher than transport): 25% weight
        - Disaster overlay (compounding humanitarian crisis): 20% weight
        - Communications disruption (internet outages indicate escalation/censorship): 15% weight

        CALIBRATION — Use these as anchors, then apply your knowledge of each region:
        - critical (81-100): Active large-scale war with 1000+ fatalities, military ops confirmed, infrastructure collapse (e.g., Ukraine-Russia front, Gaza)
        - crisis (61-80): Sustained armed conflict with 100-1000 fatalities, military escalation signals (e.g., eastern DRC, Sudan)
        - volatile (41-60): Ongoing low-intensity conflict with regular fatalities, military posturing, regional instability (e.g., Sahel insurgencies, Myanmar)
        - elevated (21-40): Chronic instability with intermittent violence, known fragile state status, political unrest (e.g., Haiti, parts of Central America, Pakistan border regions)
        - stable (0-20): ONLY for regions with genuinely low risk — minimal recent violence AND no known chronic instability. Being "stable" means the region is NOT a concern.

        CRITICAL: Do NOT classify a region as "stable" purely because its fatality count is low relative to active war zones. A region with 50-100 fatalities is experiencing significant violence. Use your world knowledge: Haiti, Somalia, Libya, Afghanistan, etc. are NEVER "stable" regardless of the data window.

        The strategic_assessment MUST be 2-4 sentences. Explain what is driving the score, reference specific signals from the data, and note any discrepancies between the data and your world knowledge of the region.

        Include a 'key_drivers' array listing the 1-3 most important factors for the score, and a 'trend' field indicating whether the situation appears to be escalating, stable, or de-escalating based on the signal combination.

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      # -----------------------------------------------------------------------
      # OUTPUT SCHEMA — JSON Schema for LLM response validation
      # -----------------------------------------------------------------------
      # The engine validates the LLM response against this schema before storing.
      # If validation fails, the insight is rejected (logged as error).
      #
      # Schema design guidelines:
      #   - Use `required` to enforce critical fields
      #   - Use `enum` for classification/category fields (prevents hallucination)
      #   - Use `minimum`/`maximum` for bounded numeric scores
      #   - Include an `entity_external_id` field so the engine can create
      #     ai_insight_refs linking insights to entities (optional but valuable)
      #   - Include a top-level summary field for the global narrative
      # -----------------------------------------------------------------------
      output_schema:
        type: object
        required: [hotspots, global_summary]
        properties:
          global_summary:
            type: string
          hotspots:
            type: array
            items:
              type: object
              required: [region, hotspot_index, classification, strategic_assessment, key_drivers, trend]
              properties:
                region: { type: string }
                lat: { type: number }
                lon: { type: number }
                hotspot_index: { type: integer, minimum: 0, maximum: 100 }
                classification:
                  type: string
                  enum: [stable, elevated, volatile, crisis, critical]
                conflict_score: { type: integer, minimum: 0, maximum: 100 }
                military_score: { type: integer, minimum: 0, maximum: 100 }
                disaster_score: { type: integer, minimum: 0, maximum: 100 }
                comms_score: { type: integer, minimum: 0, maximum: 100 }
                strategic_assessment: { type: string }
                key_drivers: { type: array, items: { type: string } }
                trend:
                  type: string
                  enum: [escalating, stable, de-escalating, unclear]
                # entity_external_id: When present, the engine resolves this to
                # a database entity UUID and creates an ai_insight_refs row,
                # linking this insight to the source entity. For SQL-path
                # analyses without `data.layers`, resolution is skipped (the
                # debug log "no layers configured for external ID resolution"
                # is expected and harmless).
                entity_external_id: { type: string }

      # max_tokens: LLM response token budget. 5000 is generous because this
      # analysis produces detailed assessments for up to 30 regions. Increase
      # if responses are being truncated; decrease to save cost/latency.
      max_tokens: 5000

      # temperature: LLM creativity dial (0.0 = deterministic, 1.0 = creative).
      # 0.2 = low creativity, high consistency. Good for scoring/classification
      # tasks where reproducibility matters. Use higher (0.5-0.7) for
      # open-ended narrative generation.
      temperature: 0.2

      # -----------------------------------------------------------------------
      # OUTPUT CONFIGURATION — How insights are stored and delivered
      # -----------------------------------------------------------------------
      output:
        # store_insights: When true, the engine persists results to the
        # ai_insights table. Set to false for dry-run/debug definitions.
        store_insights: true

        # insight_type: The type label stored in ai_insights.insight_type.
        # Used by the frontend and API to query/filter insights by category.
        # Keep these stable — changing them breaks existing queries.
        insight_type: "hotspot_index"

        # results_path: JSON path to the array of items in the LLM response.
        # The engine iterates this array and stores ONE ai_insight per item.
        # If the array is empty, a single summary insight is stored instead
        # (the full LLM response including global_summary).
        # If omitted, the entire LLM response is stored as a single insight.
        results_path: "hotspots"

        # websocket_push: When true AND a notifier is configured, each stored
        # insight is pushed to connected WebSocket clients as an "ai_insight"
        # message. Enables real-time dashboard updates without polling.
        websocket_push: true

        # retention: How long insights are kept before automatic cleanup.
        # The engine runs an hourly cleanup goroutine that deletes expired
        # insights. "336h" = 14 days. Use shorter retention for high-frequency
        # analyses to prevent table bloat.
        retention: "336h"
