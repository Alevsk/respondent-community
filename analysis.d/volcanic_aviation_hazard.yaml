# =============================================================================
# VOLCANIC AVIATION HAZARD — Volcano-to-Flight-Path Correlation
# =============================================================================
# Detects commercial aircraft operating near volcanoes with a recorded eruptive
# history AND at an altitude that could intersect an ash column. Volcanic ash is
# invisible to weather radar, can travel thousands of km, and destroys jet
# engines (cf. BA Flight 9, 1982; KLM Flight 867, 1989). This analysis
# correlates Smithsonian volcano data with real-time ADS-B flight positions.
#
# IMPORTANT: there is NO live VAAC/VONA eruption feed here. The volcano "status"
# is a geologic classification, not a current-activity signal. Proximity to a
# non-erupting volcano is therefore only a theoretical ash risk; the AI prompt
# treats those as negligible/low and the noise gate (min_attention) drops them.
# Only a genuine current ash hazard intersecting the flight earns high/critical.
#
# Data layers: volcanoes (Smithsonian GVP) × flights_commercial (ADS-B)
# =============================================================================

schema_version: 1
name: volcanic_aviation_hazard
display_name: "Volcanic Aviation Hazard"
enabled: true

schedule:
  interval: "180s"

data:
  layers: [flights_commercial]
  lookback: "6h"
  min_records: 1
  max_records: 30
  dedup:
    window: "1h"
    key_fields: ["entity_external_id", "volcano_external_id"]
  sql: |
    WITH latest_volcano AS (
      SELECT o.entity_id, o.lat, o.lon,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type = 'volcanoes'
    ),
    latest_flight AS (
      SELECT o.entity_id, o.lat, o.lon, o.altitude_m, o.ts,
             ROW_NUMBER() OVER (PARTITION BY o.entity_id ORDER BY o.ts DESC) AS rn
      FROM observations o
      JOIN entities e ON e.id = o.entity_id
      WHERE e.layer_type = 'flights_commercial'
        -- ADS-B is near-real-time; a position older than 15 min is stale, so only
        -- correlate live flights. (volcanoes is static geologic reference — no live
        -- eruption feed — and is intentionally NOT time-filtered.)
        AND o.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-15 minutes')
    ),
    active_volcanoes AS (
      -- Volcanoes with non-Holocene status (erupted in recorded geologic history).
      -- NOTE: status is a *geologic* classification, NOT a live-activity feed. We
      -- have no VAAC/VONA eruption source, so "non-Holocene" only means the volcano
      -- has a recorded eruptive history — it does NOT imply a current eruption. The
      -- AI prompt treats ash risk from a non-erupting volcano as theoretical and
      -- gates it out; a genuine current ash hazard is required for high/critical.
      -- elevation_m is the summit elevation in meters (used for ash-column math).
      SELECT v.id, v.name, v.external_id, v.metadata,
             o.lat, o.lon,
             COALESCE(json_extract(v.metadata,'$.status'), 'unknown') AS volcano_status,
             CAST(COALESCE(json_extract(v.metadata,'$.elevation'),'0') AS REAL) AS elevation_m,
             COALESCE(json_extract(v.metadata,'$.last_eruption_year'), 'unknown') AS last_eruption,
             COALESCE(json_extract(v.metadata,'$.morphology'), 'unknown') AS morphology,
             COALESCE(json_extract(v.metadata,'$.vei'), '0') AS vei
      FROM entities v
      JOIN latest_volcano o ON o.entity_id = v.id AND o.rn = 1
      WHERE v.layer_type = 'volcanoes'
        AND json_extract(v.metadata,'$.status') != 'Holocene'
    ),
    nearby_flights AS (
      -- Commercial flights within 100km of recorded-history volcanoes whose
      -- altitude could plausibly intersect an ash column.
      -- 100km = tightened en-route proximity band (was 200km, too wide -> noise).
      -- ALTITUDE-INTERSECTION FILTER: keep a flight only if its altitude could sit
      -- inside a plausible ash column — from the ground (>= 0) up to summit
      -- elevation + 15km (ash to ~FL450). Flights cruising far above that ceiling
      -- cannot be in the ash and are dropped (kills cruise-far-above noise).
      SELECT
        f.id AS flight_id,
        f.name AS flight_name,
        f.external_id AS flight_hex,
        json_extract(f.metadata,'$.callsign') AS callsign,
        json_extract(f.metadata,'$.type') AS aircraft_type,
        o_f.lat AS flight_lat, o_f.lon AS flight_lon,
        o_f.altitude_m AS flight_alt,
        o_f.ts AS flight_ts,
        av.name AS volcano_name,
        av.external_id AS volcano_external_id,
        av.volcano_status,
        CAST(ROUND(av.elevation_m) AS TEXT) AS elevation_m,
        av.last_eruption,
        av.morphology,
        CAST(ROUND(haversine_km(o_f.lat, o_f.lon, av.lat, av.lon)) AS TEXT) AS distance_km
      FROM entities f
      JOIN latest_flight o_f ON o_f.entity_id = f.id AND o_f.rn = 1
      JOIN active_volcanoes av
        ON av.lat BETWEEN o_f.lat-(100/111.32) AND o_f.lat+(100/111.32)
       AND av.lon BETWEEN o_f.lon-(100/(111.32*max(COS(RADIANS(o_f.lat)),0.01))) AND o_f.lon+(100/(111.32*max(COS(RADIANS(o_f.lat)),0.01)))
       AND haversine_km(o_f.lat, o_f.lon, av.lat, av.lon) <= 100
       AND CAST(COALESCE(o_f.altitude_m,'0') AS REAL) >= 0
       AND CAST(COALESCE(o_f.altitude_m,'0') AS REAL) <= av.elevation_m + 15000
      WHERE f.layer_type = 'flights_commercial'
        -- Keep both flight-recency filters consistent at the 15-min live window.
        AND o_f.ts > strftime('%Y-%m-%dT%H:%M:%SZ','now','-15 minutes')
    )
    SELECT
      nf.flight_id AS entity_id,
      nf.flight_name AS name,
      nf.flight_hex AS external_id,
      'flights_commercial' AS layer_type,
      nf.flight_lat AS lat, nf.flight_lon AS lon,
      nf.flight_alt AS altitude_m,
      nf.flight_ts AS ts,
      COALESCE(nf.callsign, nf.flight_name) AS callsign,
      COALESCE(nf.aircraft_type, 'unknown') AS aircraft_type,
      nf.volcano_name,
      nf.volcano_status,
      nf.elevation_m AS volcano_elevation_m,
      nf.last_eruption,
      nf.morphology,
      nf.distance_km,
      nf.volcano_external_id
    FROM nearby_flights nf
    ORDER BY CAST(nf.distance_km AS INTEGER) ASC
    LIMIT 30

ai:
  enabled: true
  operations:
    - name: volcanic_ash_risk_assessment
      tags: [osint, aviation, volcano, safety, cross-layer]
      prompt: |
        You are an aviation safety analyst specializing in volcanic ash hazards. Your assessments inform NOTAM recommendations and flight safety bulletins.

        VOLCANIC AVIATION HAZARD: {{.RecordCount}} commercial flights detected within
        100km of volcanoes with a recorded eruptive history, at altitudes that could
        plausibly intersect an ash column (last {{.Lookback}}).

        Volcanic ash is invisible to weather radar and destroys jet engines.
        Historical incidents: BA Flight 9 (1982), KLM 867 (1989) — total engine failure.

        Flight-to-volcano proximity data:
        {{range .Records}}
        - FLIGHT: {{index .Metadata "callsign"}} ({{index .Metadata "aircraft_type"}}, ID: {{.ExternalID}})
          Position: {{.Lat}}, {{.Lon}} | Alt: {{.Altitude}}m
          VOLCANO: {{index .Metadata "volcano_name"}} (ref: {{index .Metadata "volcano_external_id"}}) (status: {{index .Metadata "volcano_status"}})
          Elevation: {{index .Metadata "volcano_elevation_m"}}m | Last eruption: {{index .Metadata "last_eruption"}}
          Morphology: {{index .Metadata "morphology"}}
          Distance: {{index .Metadata "distance_km"}}km
        {{end}}

        CRITICAL — NO LIVE ERUPTION FEED:
        This analysis has NO VAAC/VONA or any current-eruption data source. The volcano
        "status" and "last eruption" fields are GEOLOGIC history, not a signal that the
        volcano is erupting now. A nearby volcano that is NOT currently erupting poses
        only a THEORETICAL ash risk — treat that as negligible or low, regardless of how
        impressive its eruptive history is. There is no ash in the sky just because an
        aircraft is near a volcano. Default every pair to negligible/low unless you have
        a concrete, current ash hazard.

        Only emit high or critical when there is a GENUINE CURRENT ash hazard that
        intersects this flight — i.e. you have specific, current evidence (from your own
        up-to-date world knowledge of an ongoing eruption at this named volcano) that an
        ash cloud is aloft right now AND the flight's altitude/position puts it in or
        near that ash. Proximity + eruptive history alone is NOT enough.

        Volcano status reference: Historical = erupted in historical time, Fumarolic = gas emissions,
        Tephrochronology = dated by tephra layers, Pleistocene = older activity.

        HAZARD CALIBRATION (current activity is the deciding factor, not history):
        - No known current eruption (the default for nearly every row): NEGLIGIBLE or LOW.
          The ash risk is theoretical. These are NOT threats — see OMISSION rule below.
        - Known unrest / recent eruptive episode but no confirmed ash aloft: LOW to MODERATE.
        - Confirmed ongoing eruption with ash, flight not clearly intersecting: MODERATE/HIGH.
        - Confirmed ongoing eruption with ash aloft AND this flight intersecting it: HIGH/CRITICAL.

        Calculate whether the flight altitude actually intersects the potential ash cloud zone. Ash clouds typically extend from the volcano summit elevation to summit + 10-15km for explosive eruptions, or summit + 2-5km for effusive eruptions. State the altitude math explicitly. (Flights cruising far above summit + 15km were already filtered out upstream.)

        Reference the relevant Volcanic Ash Advisory Centre (VAAC) jurisdiction: Tokyo VAAC for western Pacific, Buenos Aires VAAC for South America, London VAAC for North Atlantic/Europe, etc.

        For each flight-volcano pair, assess:
        1. Is there an actual CURRENT ash hazard (not just eruptive history)? If not, it is negligible/low.
        2. Whether flight altitude intersects the potential ash cloud zone (show the altitude math)
        3. Flight rerouting urgency: none/advisory/recommended/immediate
        4. Overall hazard_level: negligible/low/moderate/high/critical

        ATTENTION (maps DIRECTLY from hazard_level — NEVER auto-elevate):
        - hazard_level negligible -> attention "info"
        - hazard_level low        -> attention "low"
        - hazard_level moderate   -> attention "medium"
        - hazard_level high       -> attention "high"
        - hazard_level critical   -> attention "critical"
        Do NOT raise attention above what hazard_level implies. A moderate/advisory
        assessment is medium attention, not high — proximity to a famous volcano does
        not by itself justify a high attention.

        OMISSION RULE (core usefulness fix):
        OMIT non-threats entirely. Do NOT emit any pair whose hazard_level is negligible
        or low, whose ash_cloud_risk is none or theoretical, or whose rerouting_urgency
        is none. Return FEWER items rather than benign "no action / all clear / monitor"
        rows. If no pair has a genuine current ash hazard, return an empty hazards array
        and say so in the summary. A near-empty result is the correct output when nothing
        is actually erupting.

        Each emitted assessment field MUST be 2-3 sentences explaining WHY there is a
        genuine current hazard. Differentiate clearly between an actively erupting volcano
        and one that merely has an eruptive history.

        Respond with JSON matching this schema:
        {{.OutputSchema}}

      output_schema:
        type: object
        required: [hazards, summary]
        properties:
          summary:
            type: string
          hazards:
            type: array
            items:
              type: object
              required: [entity_external_id, callsign, volcano_name, hazard_level, attention, assessment, ash_cloud_risk]
              properties:
                callsign: { type: string }
                aircraft_type: { type: string }
                flight_altitude_m: { type: number }
                volcano_name: { type: string }
                volcano_status: { type: string }
                distance_km: { type: number }
                eruption_recency: { type: string }
                ash_cloud_risk:
                  type: string
                  enum: [none, theoretical, possible, likely, confirmed]
                vaac_jurisdiction: { type: string }
                hazard_level:
                  type: string
                  enum: [negligible, low, moderate, high, critical]
                attention:
                  type: string
                  # Maps DIRECTLY from hazard_level (negligible->info, low->low,
                  # moderate->medium, high->high, critical->critical). The noise
                  # gate (min_attention) drops everything below it.
                  enum: [info, low, medium, high, critical]
                rerouting_urgency:
                  type: string
                  enum: [none, advisory, recommended, immediate]
                assessment: { type: string }
                entity_external_id: { type: string }
                volcano_external_id: { type: string }
      max_tokens: 12000
      temperature: 0.1
      output:
        store_insights: true
        min_attention: "high"   # noise gate: drop results below this attention
        insight_type: "volcanic_aviation_hazard"
        results_path: "hazards"
        ref_fields:
          - field: "volcano_external_id"
            layer_type: "volcanoes"
        websocket_push: true
        retention: "168h"
